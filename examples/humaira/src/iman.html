<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Iman Mutiara Humaira</title>
<style>
@font-face{font-family:'Fraunces';font-style:italic;font-weight:600;src:url(fonts/fraunces-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:600;src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Jakarta';font-weight:500;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Jakarta';font-weight:600;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Jakarta';font-weight:700;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Jakarta';font-weight:800;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2) format('woff2')}
@font-face{font-family:'Ruqaa';font-weight:700;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;opacity:.6}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script src="iman/lyrics.js"></script>
<script>
// ============================================================
//  ADNI HUMAIRA  ·  9:16 · 1080x1920 · 30 fps · 66 s
//  Semua bingkai dikira daripada masa t melalui window.seek(t).
//  Tiada pemasa, tiada Math.random (PRNG berbenih sahaja).
// ============================================================
const W = 1080, H = 1920, T = 120;
const LAYER = new URLSearchParams(location.search).get('layer') || 'all';
const MAIN = document.getElementById('c');
const M = MAIN.getContext('2d');
const L = document.createElement('canvas'); L.width = W; L.height = H;
const LC = L.getContext('2d');
let X = M; // konteks semasa

// ---------- matematik ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const io = t => t <= 0 ? 0 : t >= 1 ? 1 : (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const o3 = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
const o5 = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 5);
const i3 = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * t;
const TAU = Math.PI * 2;
function spring(x, z = .55, f = 1.6) {           // tindak balas langkah, bentuk tertutup
  if (x <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + z * w / wd * Math.sin(wd * x));
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; };
const mixArr = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)];
const rgb = (a, al = 1) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;

// ---------- palet ----------
const C = {
  rose: '#ff8fb1', roseD: '#e9578a', roseL: '#ffd0de', gold: '#f7c873', goldL: '#ffe7b0', goldD: '#c98f3a',
  cream: '#fff6ea', ink: '#3a1730', sand: '#f0bf86', sandD: '#d8955d', green: '#2fa57a', greenL: '#7fe0b5'
};
const SANS = "'Jakarta','Amiri',sans-serif", SERIF = "'Fraunces','Amiri',serif";

// ---------- latar langit (kunci warna) ----------
const SKY = [
  [0.0, '#0b0b2a', '#2a1a52', '#5a2a6a', 1.0],
  [40.0, '#0f0f33', '#33206a', '#7a3a7a', 1.0],
  [80.0, '#161c48', '#43357a', '#b0607f', .8],
  [112.0, '#203060', '#7a5a96', '#f2a98a', .45],
  [120.0, '#203060', '#7a5a96', '#f2a98a', .45],
].map(k => [k[0], hex(k[1]), hex(k[2]), hex(k[3]), k[4]]);
function skyAt(t) {
  let i = 0; while (i < SKY.length - 1 && t >= SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[Math.min(i + 1, SKY.length - 1)];
  // peralihan dalam 0.6 s di kiri-kanan kunci
  let k = 0;
  if (b !== a) { const span = Math.min(.6, (b[0] - a[0]) / 2); k = io(prog(t, b[0] - span, b[0] + span)); }
  // kunci terdahulu juga mungkin masih beralih
  if (i > 0) { const p = SKY[i - 1]; const span = Math.min(.6, (a[0] - p[0]) / 2); const kk = io(prog(t, a[0] - span, a[0] + span)); if (kk < 1) { return [mixArr(p[1], a[1], kk), mixArr(p[2], a[2], kk), mixArr(p[3], a[3], kk), lerp(p[4], a[4], kk)]; } }
  return [mixArr(a[1], b[1], k), mixArr(a[2], b[2], k), mixArr(a[3], b[3], k), lerp(a[4], b[4], k)];
}

// ---------- bintang & debu cahaya ----------
const rnd = mulberry32(1446);
const STARS = Array.from({ length: 260 }, () => ({ x: rnd() * W, y: rnd() * H * .8, r: .6 + rnd() * rnd() * 2.6, f: .4 + rnd() * 1.6, ph: rnd() * TAU, warm: rnd() < .25 }));
const MOTES = Array.from({ length: 46 }, () => ({ x: rnd() * W, y: rnd() * H, r: 1.5 + rnd() * 4, v: 14 + rnd() * 30, sw: rnd() * TAU, a: .15 + rnd() * .35 }));

function drawSky(t) {
  const [top, mid, bot, stars] = skyAt(t);
  const g = M.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(top)); g.addColorStop(.55, rgb(mid)); g.addColorStop(1, rgb(bot));
  M.fillStyle = g; M.fillRect(0, 0, W, H);
  // cahaya lembut tengah
  const rg = M.createRadialGradient(540, 820, 0, 540, 820, 900);
  rg.addColorStop(0, 'rgba(255,170,200,0.10)'); rg.addColorStop(1, 'rgba(255,170,200,0)');
  M.fillStyle = rg; M.fillRect(0, 0, W, H);
  // bintang
  for (const s of STARS) {
    const tw = .55 + .45 * Math.sin(t * s.f * 2 + s.ph);
    const a = clamp(stars * tw * (1 - s.y / (H * .9)));
    if (a < .02) continue;
    M.fillStyle = s.warm ? `rgba(255,214,160,${a})` : `rgba(255,240,250,${a})`;
    M.beginPath(); M.arc(s.x, s.y + Math.sin(t * .1 + s.ph) * 2, s.r, 0, TAU); M.fill();
    if (s.r > 2.4 && a > .4) sparkle(M, s.x, s.y, s.r * 4 * tw, `rgba(255,236,245,${a * .7})`);
  }
}
function drawMotes(t) {
  for (const m of MOTES) {
    const y = ((m.y - t * m.v) % H + H) % H;
    const x = m.x + Math.sin(t * .7 + m.sw) * 18;
    const a = m.a * (.6 + .4 * Math.sin(t * 1.3 + m.sw));
    const g = M.createRadialGradient(x, y, 0, x, y, m.r * 3);
    g.addColorStop(0, `rgba(255,214,228,${a})`); g.addColorStop(1, 'rgba(255,214,228,0)');
    M.fillStyle = g; M.beginPath(); M.arc(x, y, m.r * 3, 0, TAU); M.fill();
  }
}

// ---------- tekstur akhir: vignette + bijian ----------
const VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H;
(() => { const v = VIG.getContext('2d'); const g = v.createRadialGradient(540, 900, 380, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(8,0,16,0.55)'); v.fillStyle = g; v.fillRect(0, 0, W, H); })();
const GRAIN = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d');
  const id = g.createImageData(540, 960); const r = mulberry32(77 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});

// ---------- primitif ----------
function sparkle(c, x, y, s, col) {
  c.save(); c.fillStyle = col; c.beginPath();
  c.moveTo(x, y - s); c.quadraticCurveTo(x, y, x + s, y); c.quadraticCurveTo(x, y, x, y + s); c.quadraticCurveTo(x, y, x - s, y); c.quadraticCurveTo(x, y, x, y - s);
  c.fill(); c.restore();
}
function glow(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function heartPath(c, x, y, s) {
  c.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * TAU;
    const hx = 16 * Math.pow(Math.sin(a), 3), hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
    const px = x + hx * s / 17, py = y + hy * s / 17;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}
function heart(c, x, y, s, fill, alpha = 1) {
  c.save(); c.globalAlpha *= alpha; heartPath(c, x, y, s); c.fillStyle = fill; c.fill();
  c.globalAlpha *= .5; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x - s * .45, y - s * .35, s * .16, s * .1, -.6, 0, TAU); c.fill();
  c.restore();
}
const MOONC = document.createElement('canvas'); MOONC.width = MOONC.height = 600;
function crescent(c, x, y, r, a, rot = -.35) {
  const m = MOONC.getContext('2d'); m.clearRect(0, 0, 600, 600);
  const g = m.createRadialGradient(270, 270, 10, 300, 300, r);
  g.addColorStop(0, '#fff1f5'); g.addColorStop(.6, '#ffc2d4'); g.addColorStop(1, '#ff8fb1');
  m.fillStyle = g; m.beginPath(); m.arc(300, 300, r, 0, TAU); m.fill();
  m.globalCompositeOperation = 'destination-out';
  m.beginPath(); m.arc(300 + r * .42, 300 - r * .2, r * .88, 0, TAU); m.fill();
  m.globalCompositeOperation = 'source-over';
  c.save(); c.globalAlpha *= a; glow(c, x, y, r * 2.6, 'rgba(255,150,190,A)', .35);
  c.translate(x, y); c.rotate(rot); c.drawImage(MOONC, -300, -300); c.restore();
}

// ---------- tipografi ----------
function setFont(c, f) { c.font = f; }
// teks naik perkataan demi perkataan, bertopeng
function words(str, x, y, o) {
  const c = X, size = o.size, t = o.t, t0 = o.t0, stag = o.stag ?? .07, dur = o.dur ?? .75;
  c.save(); setFont(c, o.font); c.letterSpacing = (o.ls || 0) + 'px'; c.textBaseline = 'alphabetic';
  const ws = str.split(' '); const sp = c.measureText(' ').width;
  const wd = ws.map(w => c.measureText(w).width); const total = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = o.align === 'left' ? x : x - total / 2;
  c.beginPath(); c.rect(cx - 40, y - size * 1.12, total + 80, size * 1.5); c.clip();
  ws.forEach((w, i) => {
    const p = clamp((t - t0 - i * stag) / dur); const e = o5(p);
    if (p > 0) {
      c.save(); c.globalAlpha *= clamp(p * 2.2) * (o.alpha ?? 1);
      c.translate(cx + wd[i] / 2, y + (1 - e) * size * 1.05); c.rotate((1 - e) * .08);
      if (o.shadow) { c.shadowColor = o.shadow; c.shadowBlur = 24; }
      c.fillStyle = typeof o.color === 'function' ? o.color(c, -wd[i] / 2, wd[i]) : o.color;
      c.textAlign = 'center'; c.fillText(w, 0, 0); c.restore();
    }
    cx += wd[i] + sp;
  });
  c.restore();
  return ws.length * stag + dur;
}
function lines(arr, x, y, lh, o) {
  let t0 = o.t0;
  arr.forEach((s, i) => { words(s, x, y + i * lh, Object.assign({}, o, { t0 })); t0 += (o.lineGap ?? .22); });
}
function label(str, y, t0, t, col = C.rose) {
  const c = X, p = o5(prog(t, t0, t0 + .9));
  if (p <= 0) return;
  c.save(); c.font = `700 30px ${SANS}`; c.letterSpacing = '9px'; c.textAlign = 'center';
  const w = c.measureText(str).width;
  c.globalAlpha *= p; c.fillStyle = col; c.fillText(str, 540 + 4.5, y + (1 - p) * 16);
  c.strokeStyle = col; c.lineWidth = 2; const L0 = 60 * p;
  c.beginPath(); c.moveTo(540 - w / 2 - 24, y - 10); c.lineTo(540 - w / 2 - 24 - L0, y - 10);
  c.moveTo(540 + w / 2 + 24, y - 10); c.lineTo(540 + w / 2 + 24 + L0, y - 10); c.stroke();
  sparkle(c, 540 - w / 2 - 30 - L0, y - 10, 9 * p, col); sparkle(c, 540 + w / 2 + 30 + L0, y - 10, 9 * p, col);
  c.restore();
}
function pill(str, x, y, t0, t) {
  const c = X, s = spring(t - t0, .5, 2.2); if (s <= 0) return;
  c.save(); c.font = `600 28px 'Fredoka',${SANS}`; c.letterSpacing = '1px';
  const w = c.measureText(str).width + 56;
  c.translate(x, y); c.scale(s, s); c.globalAlpha *= clamp((t - t0) * 4);
  c.beginPath(); c.roundRect(-w / 2, -26, w, 52, 26); c.fillStyle = 'rgba(255,255,255,0.09)'; c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,214,228,0.45)'; c.stroke();
  c.fillStyle = 'rgba(255,236,242,0.92)'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(str, 0, 2); c.restore();
}
// kaligrafi Arab dilukis dari kanan ke kiri
const TXT = document.createElement('canvas'); TXT.width = 1080; TXT.height = 520; const TC = TXT.getContext('2d');
function arabic(str, x, y, size, font, p, o = {}) {
  if (p <= 0) return;
  TC.clearRect(0, 0, 1080, 520);
  TC.font = `${o.weight || 700} ${size}px ${font}`; TC.textAlign = 'center'; TC.textBaseline = 'alphabetic'; TC.direction = 'rtl';
  const g = TC.createLinearGradient(0, 260 - size * .7, 0, 260 + size * .3);
  (o.grad || [C.goldL, C.gold, C.goldD]).forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
  TC.fillStyle = g; TC.shadowColor = o.glow || 'rgba(255,190,120,0.65)'; TC.shadowBlur = o.blur ?? 30;
  TC.fillText(str, 540, 300);
  const w = Math.min(1060, TC.measureText(str).width + 60);
  const right = 540 + w / 2, edge = right - w * io(p);
  const c = X; c.save(); c.globalAlpha *= (o.alpha ?? 1);
  c.beginPath(); c.rect(edge, y - 300, right - edge + 40, 520); c.clip();
  c.drawImage(TXT, x - 540, y - 300); c.restore();
  if (p < 1) { c.save(); glow(c, edge, y - size * .25, 70, 'rgba(255,220,170,A)', .7); sparkle(c, edge, y - size * .25, 26, '#fff4dc'); c.restore(); }
}
function counter(v, x, y, size, col, t) {
  const c = X; c.save(); c.font = `600 ${size}px ${SERIF}`; c.textAlign = 'center'; c.fillStyle = col;
  c.shadowColor = 'rgba(255,190,120,0.5)'; c.shadowBlur = 30;
  c.fillText(Math.round(v).toLocaleString('en-US'), x, y); c.restore();
}
// warna kecerunan teks
const goldText = (c, x0, w) => { const g = c.createLinearGradient(x0, -60, x0 + w, 10); g.addColorStop(0, C.goldL); g.addColorStop(.5, C.gold); g.addColorStop(1, '#ffd9a0'); return g; };
const roseText = (c, x0, w) => { const g = c.createLinearGradient(x0, -80, x0 + w, 10); g.addColorStop(0, '#ffd6e3'); g.addColorStop(.5, C.rose); g.addColorStop(1, '#ff6f9e'); return g; };

// ============================================================
//  WATAK: PELITA (pencerita senyap)
// ============================================================
function pelita(c, x, y, s, st) {
  const { mood = 'dot', blink = 0, blush = .5, glowA = 1, t = 0 } = st;
  c.save(); c.translate(x, y); c.scale(s, s); c.rotate(Math.sin(t * 1.3) * .045);
  glow(c, 0, 0, 230 * glowA, 'rgba(255,196,120,A)', .38);
  glow(c, 0, 0, 120, 'rgba(255,230,170,A)', .3 * glowA);
  // gelang & kubah
  c.lineWidth = 7; c.strokeStyle = C.goldD; c.beginPath(); c.arc(0, -128, 15, 0, TAU); c.stroke();
  let g = c.createLinearGradient(-60, -115, 60, -70); g.addColorStop(0, '#ffe39e'); g.addColorStop(1, '#d99a45');
  c.fillStyle = g; c.beginPath(); c.moveTo(-58, -72); c.bezierCurveTo(-52, -108, -18, -116, 0, -116); c.bezierCurveTo(18, -116, 52, -108, 58, -72); c.closePath(); c.fill();
  c.fillStyle = '#ffe9b8'; c.beginPath(); c.ellipse(-20, -96, 12, 6, -.4, 0, TAU); c.fill();
  c.beginPath(); c.roundRect(-66, -80, 132, 18, 9); c.fillStyle = '#e4a650'; c.fill();
  // badan kaca
  g = c.createRadialGradient(-8, -10, 8, 0, 0, 80); g.addColorStop(0, '#fffbe6'); g.addColorStop(.55, '#ffe6a6'); g.addColorStop(1, '#ffc56a');
  c.fillStyle = g; c.beginPath(); c.moveTo(-52, -62); c.bezierCurveTo(-74, -30, -74, 30, -52, 62); c.lineTo(52, 62); c.bezierCurveTo(74, 30, 74, -30, 52, -62); c.closePath(); c.fill();
  c.lineWidth = 5; c.strokeStyle = '#e1a24c'; c.stroke();
  c.globalAlpha = .28; c.lineWidth = 3; c.beginPath(); c.moveTo(-26, -62); c.quadraticCurveTo(-38, 0, -26, 62); c.moveTo(26, -62); c.quadraticCurveTo(38, 0, 26, 62); c.stroke(); c.globalAlpha = 1;
  c.fillStyle = 'rgba(255,255,255,0.75)'; c.beginPath(); c.ellipse(-38, -30, 6, 16, .25, 0, TAU); c.fill();
  // tapak
  c.beginPath(); c.roundRect(-60, 56, 120, 20, 10); c.fillStyle = '#e4a650'; c.fill();
  c.beginPath(); c.roundRect(-34, 74, 68, 14, 7); c.fillStyle = '#c98f3a'; c.fill();
  // pipi merah (Humaira)
  c.fillStyle = `rgba(255,105,150,${.25 + .5 * blush})`;
  c.beginPath(); c.ellipse(-35, 16, 13, 8, 0, 0, TAU); c.ellipse(35, 16, 13, 8, 0, 0, TAU); c.fill();
  // mata
  c.fillStyle = C.ink; c.strokeStyle = C.ink; c.lineCap = 'round'; c.lineWidth = 5.5;
  const ey = 0;
  if (mood === 'happy') {
    c.beginPath(); c.arc(-21, ey + 4, 9, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.beginPath(); c.arc(21, ey + 4, 9, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
  } else {
    const r = mood === 'wow' ? 9.5 : 8, sy = Math.max(.08, 1 - blink);
    [-21, 21].forEach(ex => {
      c.save(); c.translate(ex, ey); c.scale(1, sy); c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-2.5, -3, r * .34, 0, TAU); c.fill(); c.restore();
    });
    if (mood === 'sad') { c.lineWidth = 3.5; c.beginPath(); c.moveTo(-31, -16); c.lineTo(-13, -12); c.moveTo(31, -16); c.lineTo(13, -12); c.stroke(); }
  }
  // mulut
  c.lineWidth = 4.5;
  if (mood === 'wow') { c.beginPath(); c.ellipse(0, 22, 6, 8, 0, 0, TAU); c.fill(); }
  else if (mood === 'sad') { c.beginPath(); c.arc(0, 28, 8, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
  else { c.beginPath(); c.arc(0, 14, 8, Math.PI * .15, Math.PI * .85); c.stroke(); }
  c.restore();
}
// kedudukan pelita mengikut masa
const PK = [
  [1.8, 540, 1440, 1.05], [5.3, 540, 1440, 1.05], [6.3, 885, 1010, .5], [12.0, 885, 1010, .5], [12.9, 860, 960, .72], [18.0, 860, 960, .72],
  [19.0, 900, 1100, .55], [24.6, 900, 1100, .55], [25.4, 880, 1150, .55], [30.6, 880, 1150, .55], [31.4, 900, 990, .5], [36.6, 900, 990, .5],

function sunIcon(c, x, y, r, t) { glow(c, x, y, r * 2.4, 'rgba(255,214,120,A)', .5); c.save(); c.translate(x, y); c.rotate(t * .4); c.fillStyle = '#ffd36e'; for (let k = 0; k < 10; k++) { c.rotate(TAU / 10); c.beginPath(); c.ellipse(0, -r * 1.35, r * .14, r * .3, 0, 0, TAU); c.fill(); } c.restore(); c.fillStyle = '#ffe08a'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.fillStyle = C.ink; c.beginPath(); c.arc(x - r * .3, y - r * .05, r * .09, 0, TAU); c.arc(x + r * .3, y - r * .05, r * .09, 0, TAU); c.fill(); c.strokeStyle = C.ink; c.lineWidth = r * .07; c.beginPath(); c.arc(x, y + r * .15, r * .22, .2, Math.PI - .2); c.stroke(); c.fillStyle = 'rgba(255,120,150,0.5)'; c.beginPath(); c.arc(x - r * .5, y + r * .2, r * .13, 0, TAU); c.arc(x + r * .5, y + r * .2, r * .13, 0, TAU); c.fill(); }
const ICON = {

const KEYMAP = [

function iconsFor(text) { const s = text.toLowerCase(); for (const [re, ic] of KEYMAP) if (re.test(s)) return ic; return ['star', 'pearl']; }

// --- latar (lapisan belakang) ---
function sea(c, t) {
  const y0 = 1280;
  const g = c.createLinearGradient(0, y0, 0, H); g.addColorStop(0, '#3d4f9a'); g.addColorStop(.4, '#2b3577'); g.addColorStop(1, '#1a1f4f');

function clamBack(c, t) {

}
function drawBG(t) {
  drawSky(t); drawMotes(t);
  // bulan mutiara di langit
  pearl(M, 820, 330, 78 + 3 * Math.sin(t * .8));
  for (let k = 0; k < 3; k++) { const a = t * .5 + k * 2.1; sparkle(M, 820 + Math.cos(a) * 140, 330 + Math.sin(a) * 90, 10 + 4 * Math.sin(t * 3 + k), '#fff0f8'); }
  sea(M, t);
  clamBack(M, t);
}
// --- hadapan (lapisan depan) ---
function clamFront(c, t) {
  const cx = 540, top = 1395;
  c.save();
  const g = c.createLinearGradient(0, top, 0, top + 260); g.addColorStop(0, '#ffe3ee'); g.addColorStop(.6, '#ffb6d0'); g.addColorStop(1, '#ef8fb5');
  c.fillStyle = g; c.beginPath();
  c.moveTo(cx - 470, top - 10);
  c.quadraticCurveTo(cx, top + 50, cx + 470, top - 10);
  c.bezierCurveTo(cx + 470, top + 150, cx + 260, top + 250, cx, top + 255);
  c.bezierCurveTo(cx - 260, top + 250, cx - 470, top + 150, cx - 470, top - 10); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(220,100,150,0.35)'; c.lineWidth = 7; c.lineCap = 'round';

  for (let k = 0; k < 9; k++) { const u = k / 8; const x = cx - 430 + u * 860; const y = top - 10 + 4 * 60 * u * (1 - u) * .5 + 6; pearl(c, x, y, 13 + (k % 2) * 4); }
  c.restore();

  for (let k = 0; k < 14; k++) { const tt = ((t * .18 + k / 14) % 1); const x = 60 + (k * 173) % 960 + Math.sin(t * 2 + k) * 14; const y = 1900 - tt * 700; c.strokeStyle = `rgba(220,240,255,${.6 * Math.sin(tt * Math.PI)})`; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 7 + (k % 4) * 4, 0, TAU); c.stroke(); }

function header(c, t) {

  words('bersama Adni Humaira', 540, ty + lerp(56, 78, k), { t0: .7, t, size: s2, font: `italic 600 ${s2}px ${SERIF}`, color: roseText, shadow: 'rgba(255,120,170,0.5)', stag: .1 });

function subtitle(c, t) {

  rows.forEach((r, i) => {
    const y = y0 + 20 + lh * (i + .78);
    // perkataan kunci berwarna emas
    const parts = r.split(' '); let x = 540 - c.measureText(r).width / 2; c.textAlign = 'left';
    parts.forEach(w => { const key = /mutiara|iman|hati|allah|cahaya|syurga|cinta|kasih/i.test(w); c.fillStyle = key ? C.goldL : '#ffffff'; c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 8; c.fillText(w, x, y); x += c.measureText(w + ' ').width; });

  c.restore();
}
const SLOTS = [[165, 520], [915, 470], [150, 900], [930, 860], [190, 1180], [890, 1170]];
function lyricIcons(c, t) {

    if (t < l.t0 - .2 || t > l.t1 + .8) return;

function finale(c, t) {

  for (let k = 0; k < 7; k++) { const tt = ((t - 114.4) * .4 + k / 7) % 1; heart(c, 140 + k * 135, 1300 - tt * 700, 16 + (k % 3) * 6, k % 2 ? C.rose : C.goldL, Math.sin(tt * Math.PI)); }

function drawFront(t) {

window.seek = function (t) {

(async () => {
  const fams = [`italic 600 40px Fraunces`, `600 40px Fraunces`, `500 40px Jakarta`, `600 40px Jakarta`, `700 40px Jakarta`, `400 40px Amiri`, `700 40px Ruqaa`, `600 40px Fredoka`];
