const SC = [

function sceneAt(t) { for (let i = SC.length - 1; i >= 0; i--) if (t >= SC[i].t0) return i; return 0; }

/* ---------- latar: corak bintang lapan bucu ---------- */
const TILE = document.createElement('canvas'); TILE.width = TILE.height = 180;

function background(t) {

  const a = hex(SC[Math.max(0, i - 1)].tint), b = hex(SC[i].tint), c = a.map((v, j) => Math.round(mix(v, b[j], k)));

/* ---------- penolong animasi ---------- */
function vis(u, D, a, last) { const p = out(seg(u, a, a + 0.7)), e = last ? 1 : 1 - io(seg(u, D - 0.55, D - 0.05)); return { p, e, al: p * e, dy: (1 - p) * 40 - (1 - e) * 26 }; }

function star8(cx, cy, R, p, lw, color) {

/* ---------- ilustrasi ---------- */

function scales(u, x, y) {

  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = GOLD; ctx.fillRect(-7, -170, 14, 330); rr(-120, 160, 240, 24, 10); ctx.fill(); ctx.beginPath(); ctx.arc(0, -178, 16, 0, TAU); ctx.fill();

    ctx.strokeStyle = 'rgba(224,180,90,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - 70, ey + 130); ctx.moveTo(ex, ey); ctx.lineTo(ex + 70, ey + 130); ctx.stroke();

function coins(x, y, n, dim) {
  for (let k = 0; k < n; k++) { const yy = y - k * 22; ctx.fillStyle = dim ? `rgba(${Math.round(mix(240, 120, dim))},${Math.round(mix(199, 110, dim))},${Math.round(mix(108, 100, dim))},1)` : (k % 2 ? '#f0c76c' : '#d9a441'); ctx.beginPath(); ctx.ellipse(x, yy, 120, 30, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(70,45,10,0.55)'; ctx.lineWidth = 3; ctx.stroke(); }
}
function amanahArt(u, x, y) {
  coins(x, y + 60, 6, 0);
  ctx.font = '800 40px "Plus Jakarta Sans"'; ctx.fillStyle = CREAM; ctx.textAlign = 'center'; ctx.fillText('AMANAH', x, y + 170);

  ctx.font = '500 20px "DM Mono"'; ctx.fillStyle = 'rgba(244,236,216,0.7)'; ctx.fillText('MENAHAN HAWA NAFSU', lx, y + 232); ctx.fillText('MELAMPAUI BATAS', rx, y + 232);

/* ---------- kad ayat / hadis ---------- */
function card(c, x, y, w, al, dy) {
  if (al <= 0.01) return;
  const fT = '600 34px "Plus Jakarta Sans"', ls = wrap(c.text, fT, w - 140);
  let arFs = PT ? 56 : 58, arH = 0, AR = c.ar;
  if (AR && PT) { ctx.direction = 'rtl'; ctx.font = `400 ${arFs}px Amiri`; const o = []; for (const l of AR) { if (ctx.measureText(l).width <= w - 140) { o.push(l); continue; } const ws = l.split(' '); let best = null; for (let k = 1; k < ws.length; k++) { const a = ws.slice(0, k).join(' '), b = ws.slice(k).join(' '), m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width); if (!best || m < best.m) best = { m, l: [a, b] }; } o.push(...best.l); } AR = o; ctx.direction = 'ltr'; }

  if (c.ar) { ctx.direction = 'rtl'; ctx.font = `400 ${arFs}px Amiri`; while (Math.max(...c.ar.map(l => ctx.measureText(l).width)) > w - 140) { arFs -= 4; ctx.font = `400 ${arFs}px Amiri`; } ctx.direction = 'ltr'; arH = c.ar.length * arFs * 1.5 + 6; }

  ctx.globalAlpha = al; ctx.save(); ctx.translate(0, dy);
  rr(x, y, w, h, 24); ctx.fillStyle = 'rgba(4,8,18,0.74)'; ctx.fill(); ctx.strokeStyle = 'rgba(224,180,90,0.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = GOLD; ctx.fillRect(x, y + 24, 6, h - 48);
  let ty = y + 36; ctx.textAlign = 'center';
  if (c.ar) { ctx.direction = 'rtl'; ctx.font = `400 ${arFs}px Amiri`; ctx.fillStyle = '#fff'; c.ar.forEach((l, i) => ctx.fillText(l, x + w / 2, ty + arFs * 1.0 + i * arFs * 1.5)); ctx.direction = 'ltr'; ty += arH; }

  ctx.font = fT; ctx.fillStyle = 'rgba(244,236,216,0.95)'; ty += 34; for (const l of ls) { ctx.fillText(l, x + w / 2, ty); ty += 48; }

  ctx.strokeStyle = GOLD; ctx.fillStyle = GOLD; ctx.lineWidth = 4;
