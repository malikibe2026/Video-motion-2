<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Kisah tumbesaran 9:16</title>
<style>
@font-face { font-family: Fredoka; font-weight: 500; src: url(assets/fonts/fredoka-latin-500-normal.woff2); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(assets/fonts/fredoka-latin-600-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 700; src: url(assets/fonts/nunito-latin-700-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 800; src: url(assets/fonts/nunito-latin-800-normal.woff2); }
:root { --ink: #3b2a3f; --soft: #8a7385; --pink: #e8628e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff7ee; }
#stage, .scene, .fill, #scenes { position: absolute; inset: 0; overflow: hidden; }
#scenes { z-index: 0; }
#vig, #tl, #caps, #chip, #tag { z-index: 2; }
#flash { z-index: 3; }
.scene { display: none; transform-origin: 50% 50%; }
.abs { position: absolute; left: 0; top: 0; }
img.st { position: absolute; left: 0; top: 0; transform-origin: 50% 55%; }
.F6 { font-family: Fredoka; font-weight: 600; }
.N8 { font-family: Nunito; font-weight: 800; }
.mask { overflow: hidden; display: block; }
.mask > span { display: inline-block; }
/* polaroid */
.pol { position: absolute; left: 0; top: 0; width: 300px; height: 372px; background: #fff; border-radius: 6px; padding: 14px 14px 0;
  box-shadow: 0 18px 30px rgba(80,50,40,.22), 0 2px 4px rgba(80,50,40,.15); transform-origin: 50% 40%; }
.pol .ph { width: 272px; height: 280px; border-radius: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pol .ph img { max-width: 112%; max-height: 112%; }
.pol .lb { font: 500 19px/1 Fredoka; color: #7a6672; text-align: center; margin-top: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tape { position: absolute; left: 100px; top: -16px; width: 100px; height: 32px; background: rgba(255,214,120,.65); transform: rotate(-4deg); }
/* kad */
.card { position: absolute; left: 0; top: 0; width: 320px; height: 380px; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: 0 16px 30px rgba(60,30,50,.18); border: 8px solid #fff; }
.face img { max-width: 100%; max-height: 104%; }
.face.back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, #f8a3bd 0 18px, #fbc3d3 18px 36px); }
/* tindanan */
#chip { position: absolute; left: 56px; top: 44px; padding: 14px 26px 16px; background: rgba(255,255,255,.88); border-radius: 22px; box-shadow: 0 8px 24px rgba(60,30,50,.12); }
#chip .k { font: 800 17px/1 Nunito; letter-spacing: .3em; color: var(--pink); }
#chip .v { position: relative; height: 50px; margin-top: 6px; overflow: hidden; }
#chip .v span { position: absolute; left: 0; top: 0; font: 600 42px/50px Fredoka; color: var(--ink); white-space: nowrap; }
.cap { position: absolute; left: 0; width: 1080px; bottom: 170px; text-align: center; display: none; }
.cap .pill { display: inline-block; padding: 16px 34px 18px; background: rgba(255,255,255,.9); border-radius: 40px; box-shadow: 0 10px 30px rgba(60,30,50,.14);
  font: 800 42px/1.3 Nunito; color: var(--ink); max-width: 960px; }
.cap .w { display: inline-block; }
#tag { position: absolute; right: 40px; top: 36px; font: 800 17px/1 Nunito; letter-spacing: .14em; color: rgba(59,42,63,.55); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(60,30,40,.13) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="vig"></div>
  <svg id="tl" class="abs" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="chip"><div class="k">UMUR</div><div class="v" id="cv"><span id="ca"></span><span id="cb"></span></div></div>
  <span id="meas" style="position:absolute;left:-9999px;top:0;font:600 42px/50px Fredoka;white-space:nowrap"></span>
  <div id="tag">ILUSTRASI KARTUN</div>
  <div id="flash"></div>
</div>
<script>
'use strict';
// ================= alat asas =================
const W = 1080, H = 1920, B = 60 / 96;      // 96 BPM
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = k => k * k * (3 - 2 * k);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eIn = k => k * k * k, eOut = k => 1 - Math.pow(1 - k, 3);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function spring(t, f = 2.2, z = .55) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t));
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], k))).join(',')})`; }
function h(tag, cls, parent, style = '', html = '') {
  const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html) e.innerHTML = html;
  if (parent) parent.appendChild(e); return e;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, at, parent) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function img(it, parent) { const e = h('img', 'st', parent); e.src = it.file; e.width = it.w; e.height = it.h; return e; }
// letak imej pada pusat (x,y) dengan tinggi sasaran
function put(e, it, x, y, sc, rot = 0, op = 1, extra = '') {
  if (op <= 0.002) { e.style.display = 'none'; return; }
  e.style.display = 'block'; e.style.opacity = op;
  e.style.transform = `translate(${x - it.w / 2}px,${y - it.h / 2}px) rotate(${rot}deg) scale(${sc})${extra}`;
}
const fit = (it, hh, ww = 9999) => Math.min(hh / it.h, ww / it.w);
function maskWords(parent, text, cls, style = '') {
  return text.split(' ').map(w => { const m = h('span', 'mask ' + (cls || ''), parent, 'display:inline-block;' + style); h('span', '', m, '', w + '&nbsp;'); return m.firstChild; });
}

// ================= data =================
let MAN, INFO, G = {}, SC = [], EV = [], TOTAL = 0;
const scenesEl = document.getElementById('scenes');
const sceneDefs = [];
function def(o) { sceneDefs.push(o); }

// ---------- 0. Pembukaan: subuh ----------
def({ name: 'buka', beats: 10, tin: ['none', 0],
  build(S) {
    S.cv = h('canvas', 'abs', S.el); S.cv.width = W; S.cv.height = H; S.cx = S.cv.getContext('2d');
    const box = h('div', 'abs', S.el, 'width:1080px;top:640px;text-align:center');
    S.k = h('div', 'N8', box, 'font-size:32px;letter-spacing:.6em;color:#fff;opacity:0', 'KISAH');
    const nm = h('div', 'F6', box, 'font-size:200px;line-height:1.05;margin-top:16px');
    S.L = [];
    INFO.nama.split(' ').forEach((w, wi) => { const ln = h('div', '', nm); [...w].forEach(c => S.L.push(h('span', '', ln, 'display:inline-block', c))); });
    const sb = h('div', 'mask N8', box, 'font-size:42px;margin-top:22px;height:58px');
    S.sub = h('span', '', sb, '', INFO.lahir ? 'Lahir ' + INFO.lahir : 'Baru lahir hingga 1 tahun 7 bulan');
    EV.push({ t: S.t0 + 1.2, type: 'title' });
  },
  draw(S, lt) {
    const c = S.cx, p = eIO(clamp(lt / 5.2));
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix('#2b1d3a', '#ffe9e4', p)); g.addColorStop(.6, mix('#5b2f55', '#fff1e6', p)); g.addColorStop(1, mix('#8a4a62', '#fff7ee', p));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const sy = lerp(2200, 1250, eOut(clamp(lt / 4.6)));
    const rg = c.createRadialGradient(540, sy, 0, 540, sy, 1100);
    rg.addColorStop(0, 'rgba(255,214,140,.95)'); rg.addColorStop(.25, 'rgba(255,190,150,.5)'); rg.addColorStop(1, 'rgba(255,190,150,0)');
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 46; i++) {
      const x = rnd(i) * W + Math.sin(lt * .6 + i) * 20, y = ((rnd(i + 50) * H * 1.2) - lt * (30 + rnd(i + 9) * 50)) % (H * 1.2);
      const yy = y < -60 ? y + H * 1.2 : y, r = 6 + rnd(i + 3) * 26;
      c.globalAlpha = (.12 + .18 * rnd(i + 4)) * (.6 + .4 * Math.sin(lt * 2 + i));
      c.fillStyle = i % 3 ? '#ffd9a8' : '#ffc2d6'; c.beginPath(); c.arc(x, yy, r, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
    const lk = clamp((lt - 2.6) / 2.4);
    if (lk > 0 && lk < 1) {
      const y = lerp(-600, 2500, lk), lg = c.createLinearGradient(0, y - 400, 0, y + 400);
      lg.addColorStop(0, 'rgba(255,240,220,0)'); lg.addColorStop(.5, 'rgba(255,240,220,.35)'); lg.addColorStop(1, 'rgba(255,240,220,0)');
      c.fillStyle = lg; c.fillRect(0, 0, W, H);
    }
    const col = mix('#ffffff', '#3b2a3f', clamp((lt - 1.6) / 2)), out = eIn(clamp((lt - 5.0) / 0.6));
    S.k.style.opacity = clamp((lt - 0.6) / 0.6) * (1 - out); S.k.style.color = mix('#ffffff', '#e8628e', clamp((lt - 1.6) / 2));
    S.L.forEach((sp, i) => {
      const a = spring(lt - 1.1 - i * 0.07, 1.9, .55);
      sp.style.color = col; sp.style.opacity = clamp((lt - 1.1 - i * .07) / .15) * (1 - out);
      sp.style.transform = `translateY(${(1 - a) * -140 - out * 80}px) rotate(${(1 - a) * (i % 2 ? 14 : -14)}deg)`;
      sp.style.filter = `blur(${(1 - clamp((lt - 1.1 - i * .07) / .3)) * 8}px)`;
    });
    const a = spring(lt - 2.3, 1.6, .75);
    S.sub.style.transform = `translateY(${(1 - a) * 100 - out * 100}%)`; S.sub.style.color = mix('#f3d4e0', '#8a7385', clamp((lt - 1.6) / 2));
  } });

// ---------- 1. Hari pertama: Ken Burns ----------
def({ name: 'lahir', beats: 10, tin: ['fade', 1.0], cap: 'Seorang puteri kecil lahir ke dunia.', capAt: 3,
  ages: [[0, 'Baru Lahir', 0, 0]],
  build(S) {
    S.el.style.background = 'radial-gradient(circle at 50% 58%, #fff8f2 0%, #ffe6ee 55%, #f9d4e3 100%)';
    S.halo = h('div', 'abs', S.el, 'width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 70%)');
    S.cv = h('canvas', 'abs', S.el); S.cv.width = W; S.cv.height = H; S.cx = S.cv.getContext('2d');
    S.it = G['Baru Lahir'][0]; S.im = img(S.it, S.el);
    const d = h('div', 'abs', S.el, 'left:90px;top:230px');
    const parts = (INFO.lahir || 'Hari Pertama').split(' ');
    S.dk = h('div', 'mask N8', d, 'font-size:28px;letter-spacing:.4em;color:#e8628e;height:38px'); h('span', '', S.dk, '', 'HARI PERTAMA');
    const row = h('div', '', d, 'display:flex;align-items:flex-end;gap:22px');
    S.dn = h('div', 'mask F6', row, 'font-size:200px;line-height:210px;height:210px;color:#e8628e'); h('span', '', S.dn, '', parts[0]);
    S.dm = h('div', 'mask F6', row, 'font-size:58px;line-height:70px;height:74px;margin-bottom:30px;color:#3b2a3f'); h('span', '', S.dm, '', parts.slice(1).join('<br>'));
    S.dm.style.height = '150px'; S.dm.style.lineHeight = '70px';
    EV.push({ t: S.t0 + B, type: 'pop', k: 0 });
  },
  draw(S, lt) {
    const pulse = 1 + .035 * Math.sin(lt * 2.2);
    S.halo.style.transform = `translate(${540 - 500}px,${1110 - 500}px) scale(${pulse * clamp(spring(lt - .4, 1.2, .8))})`;
    const tp = lt - B, sp = spring(tp, 1.5, .7), kb = 1 + 0.07 * clamp(lt / 6.25);
    put(S.im, S.it, 540, 1110 + (1 - sp) * 80 + Math.sin(lt * 1.3) * 6, fit(S.it, 860, 900) * kb * lerp(.88, 1, sp), -3 + lt * .5, clamp(tp / .5));
    const c = S.cx; c.clearRect(0, 0, W, H);
    for (let i = 0; i < 34; i++) {
      const x = 80 + rnd(i) * 920, y = 560 + rnd(i + 30) * 1050, a = Math.max(0, Math.sin(lt * 2.5 + i * 1.7)) * clamp((lt - 1) / 1);
      const r = 6 + rnd(i + 5) * 12; c.globalAlpha = a * .8; c.fillStyle = i % 2 ? '#ffffff' : '#ffd36e';
      c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r); c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill();
    }
    c.globalAlpha = 1;
    [[S.dk, .9], [S.dn, 1.05], [S.dm, 1.25]].forEach(([m, d]) => { const a = spring(lt - d, 1.6, .75); m.firstChild.style.transform = `translateY(${(1 - a) * 105}%)`; });
  } });

// ---------- 2. Bulan-bulan awal: polaroid, kamera turun ----------
def({ name: 'polaroid', beats: 20, tin: ['pushUp', .8], cap: 'Bulan-bulan awal: banyak tidur, sesekali menangis, dan senyuman pertama.', capAt: 2,
  ages: [[0, 'Bawah 7 Bulan', 0, 6.9]],
  build(S) {
    S.el.style.background = 'repeating-linear-gradient(115deg,#f3e4d0 0 22px,#f0dfc8 22px 44px)';
    S.world = h('div', 'abs', S.el, 'width:1080px;height:3840px');
    const PAL = ['#ffe1e8', '#e0f2ff', '#e8f7e2', '#f1e6ff', '#fff2d6', '#ffe8dc'];
    for (let i = 0; i < 26; i++) h('div', 'abs', S.world, `left:${rnd(i + 70) * 1060}px;top:${rnd(i + 90) * 3800}px;width:${10 + rnd(i) * 14}px;height:${10 + rnd(i) * 14}px;border-radius:50%;background:${['#f6b7c8', '#a9d6f5', '#bfe5b5', '#ffd27e'][i % 4]};opacity:.55`);
    S.items = G['Bawah 7 Bulan'].map((it, k) => {
      const r = Math.floor(k / 2), col = k % 2;
      const card = h('div', 'pol', S.world); const ph = h('div', 'ph', card, `background:${PAL[k % PAL.length]}`);
      const im = h('img', '', ph); im.src = it.file; h('div', 'lb', card, '', it.desc); h('div', 'tape', card, `transform:rotate(${(rnd(k + 3) - .5) * 14}deg)`);
      EV.push({ t: S.t0 + (2 + k) * B, type: 'pop', k });
      return { card, X: col ? 760 : 320, Y: 600 + r * 440 + col * 200, r: (rnd(k * 3.3) - .5) * 14, pop: (2 + k) * B };
    });
    S.title = h('div', 'abs F6', S.world, 'left:90px;top:190px;font-size:64px;color:#3b2a3f', 'Bulan-bulan awal');
    S.und = s('path', { d: 'M90 285 q 55 -14 110 0 t 110 0 t 110 0 t 110 0', fill: 'none', stroke: '#e8628e', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': 480, 'stroke-dashoffset': 480 }, s('svg', { width: 1080, height: 400, class: 'abs' }, S.world));
  },
  draw(S, lt) {
    const camY = 1920 * sstep(clamp((lt - 2 * B) / (14 * B)));
    S.world.style.transform = `translateY(${-camY}px)`;
    S.items.forEach(o => {
      const tp = lt - o.pop; if (tp < 0) { o.card.style.display = 'none'; return; }
      const sp = spring(tp, 2.3, .5); o.card.style.display = 'block'; o.card.style.opacity = clamp(tp / .12);
      o.card.style.transform = `translate(${o.X - 150}px,${o.Y - 186 - (1 - sp) * 60}px) rotate(${o.r + (1 - sp) * 18}deg) scale(${lerp(1.5, 1, sp) * 1.18})`;
    });
    const a = spring(lt - .5, 1.6, .7); S.title.style.transform = `translateX(${(1 - a) * 60}px)`; S.title.style.opacity = clamp((lt - .5) / .3);
    S.und.setAttribute('stroke-dashoffset', 480 * (1 - eOut(clamp((lt - .9) / .8))));
  } });

// ---------- 3. 7 bulan: panel 2x2 ----------
def({ name: 'panel', beats: 10, tin: ['wipe', .8], cap: 'Tujuh bulan. Sudah pandai duduk dan bergaya.', capAt: 2,
  ages: [[0, '7 Bulan', 7, 7]],
  build(S) {
    S.el.style.background = '#fff7ee';
    const COL = ['#ffd6c9', '#cfeedd', '#e3d7f7', '#d3e8fb'], its = G['7 Bulan'];
    S.p = its.map((it, k) => {
      const pw = 540, ph = 960, px = (k % 2) * pw, py = Math.floor(k / 2) * ph;
      const pan = h('div', 'abs', S.el, `left:${px}px;top:${py}px;width:${pw + 1}px;height:${ph + 1}px;background:${COL[k % 4]};overflow:hidden`);
      h('div', 'abs F6', pan, `left:0;top:560px;width:${pw}px;text-align:center;font-size:380px;color:rgba(255,255,255,.55)`, '7');
      const im = img(it, pan); EV.push({ t: S.t0 + (1 + k) * B, type: 'pop', k });
      return { pan, im, it, pw, ph, pop: (1 + k) * B, top: k < 2 };
    });
  },
  draw(S, lt) {
    S.p.forEach((o, k) => {
      const e = eOut(clamp((lt - o.pop + .2) / .5));
      o.pan.style.clipPath = k % 2 ? `inset(0 0 ${(1 - e) * 100}% 0)` : `inset(${(1 - e) * 100}% 0 0 0)`;
      const tp = lt - o.pop - .1, sp = spring(tp, 1.8, .6);
      put(o.im, o.it, o.pw / 2 + Math.sin(lt * .9 + k) * 8, (o.top ? 540 : 430) + (1 - sp) * 140, fit(o.it, 700, 480) * lerp(1.12, 1, sp), (k % 2 ? 2 : -2), clamp(tp / .15));
    });
  } });

// ---------- 4. 8 bulan: karusel 3D ----------
def({ name: 'karusel', beats: 14, tin: ['iris', .9], cap: 'Lapan bulan. Makin ceria, makin aktif.', capAt: 2,
  ages: [[0, '8 Bulan', 8, 8]],
  build(S) {
    S.el.style.background = 'linear-gradient(#cfe8ff 0%, #e8f3ff 55%, #fff1f5 100%)';
    S.cl = [0, 1, 2, 3, 4, 5].map(i => h('div', 'abs', S.el, `width:${380 + i * 50}px;height:${120 + i * 12}px;border-radius:100px;background:radial-gradient(ellipse,#fff 30%,rgba(255,255,255,0) 70%)`));
    h('div', 'abs F6', S.el, 'width:1080px;top:330px;text-align:center;font-size:300px;line-height:1;color:transparent;-webkit-text-stroke:4px rgba(120,175,230,.55)', '8<br>BULAN');
    S.items = G['8 Bulan'].map((it, k) => { EV.push({ t: S.t0 + (1 + k) * B, type: 'pop', k }); return { it, im: img(it, S.el), pop: (1 + k) * B }; });
  },
  draw(S, lt) {
    S.cl.forEach((c, i) => { const x = ((rnd(i) * 1500 + lt * (25 + i * 9)) % 1500) - 400; c.style.transform = `translate(${x}px,${120 + i * 260 + rnd(i + 4) * 80}px)`; });
    const n = S.items.length, base = -0.42 * lt + 0.6;
    S.items.forEach((o, k) => {
      const th = base + k * 2 * Math.PI / n, z = Math.cos(th), depth = (z + 1) / 2;
      const tp = lt - o.pop, sp = spring(tp, 2, .55);
      const sc = fit(o.it, 540, 430) * (0.45 + 0.55 * depth) * lerp(.3, 1, sp);
      put(o.im, o.it, 540 + 360 * Math.sin(th), 1000 + 300 * z, sc, Math.sin(th) * -6, clamp(tp / .15));
      o.im.style.zIndex = Math.round(depth * 100);
      o.im.style.filter = `brightness(${0.78 + 0.22 * depth}) saturate(${0.75 + 0.25 * depth})`;
    });
  } });

// ---------- 5. 9 hingga 11 bulan ----------
def({ name: 'odometer', beats: 21, tin: ['whip', .6], cap: 'Sembilan, sepuluh, sebelas bulan. Setiap bulan ada cerita baharu.', capAt: 2,
  ages: [[0, '9 Bulan', 9, 9], [6, '10 Bulan', 10, 10], [13, '11 Bulan', 11, 11]],
  build(S) {
    S.el.style.background = 'radial-gradient(circle at 20% 20%, #fff3ea 0%, #ffe6da 60%, #ffdccd 100%)';
    h('div', 'abs', S.el, 'inset:0;background-image:radial-gradient(rgba(232,98,142,.12) 3px, transparent 3.5px);background-size:44px 44px');
    const od = h('div', 'abs', S.el, 'left:90px;top:230px;width:420px;height:260px;overflow:hidden');
    S.col = h('div', 'abs F6', od, 'width:420px;font-size:240px;line-height:260px;color:#e8628e', '9<br>10<br>11');
    h('div', 'abs F6', S.el, 'left:470px;top:330px;font-size:96px;color:#3b2a3f', 'Bulan');
    const DISC = ['#ffc7d6', '#c9e9ff', '#d9f5c9'], DP = [[290, 860], [790, 920], [540, 1340]];

    // kartun keluarga + gambar foto sebenar (INFO.foto_keluarga, dalam bingkai)

    (INFO.foto_keluarga || []).forEach(f => {
      const iw = 820, ih = Math.round(iw * f.h / f.w), fr = h('div', 'abs', S.el, 'padding:16px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(80,40,40,.25);transform-origin:50% 55%');
      const im = h('img', '', fr, `display:block;width:${iw}px;height:${ih}px;border-radius:4px`); im.src = f.file;
      fam.push({ it: { w: iw + 32, h: ih + 32 }, el: fr, photo: true });
    });
    S.items = fam.map((o, k) => { const pop = (k ? 4.5 : 2) * B; EV.push({ t: S.t0 + pop, type: 'pop', k });
      return { it: o.it, im: o.el, pop, x: 540, y: k ? 1240 : 640, hh: o.photo ? o.it.h : (k ? 760 : 560), ww: o.photo ? o.it.w : (k ? 700 : 900), r: k ? 3 : -3, from: k ? 1 : -1 }; });
  },
  draw(S, lt) {
    S.rays.style.transform = `rotate(${lt * 6}deg)`;
    S.hearts.forEach(o => { const tt = lt - o.d; const y = 2000 - tt * o.v; o.p.setAttribute('transform', `translate(${o.x + Math.sin(tt * 1.5 + o.x) * 30} ${tt > 0 ? y : 2100}) scale(${o.sc})`); });
    S.items.forEach(o => { const tp = lt - o.pop, sp = spring(tp, 1.5, .7); put(o.im, o.it, o.x + (1 - sp) * 800 * o.from, o.y + Math.sin(lt * 1.2 + o.y) * 6, fit(o.it, o.hh, o.ww), o.r + Math.sin(lt * 1.1 + o.y) * 1.5, clamp(tp / .2)); });
  } });

// ---------- 11. Penutup: mozek ----------
def({ name: 'penutup', beats: 12, tin: ['fade', 1.0], hideChip: true,
  build(S) {
    S.el.style.background = '#fff7ee';
    S.cv = h('canvas', 'abs', S.el); S.cv.width = W; S.cv.height = H; S.cx = S.cv.getContext('2d');
    S.tiles = MAN.map((it, i) => { const im = new Image(); im.src = it.file; return { im, it, c: i % 6, r: Math.floor(i / 6) }; });
    const box = h('div', 'abs', S.el, 'width:1080px;top:640px;text-align:center');
    const nm = h('div', 'F6', box, 'font-size:180px;line-height:1.05;color:#3b2a3f');
    S.L = []; INFO.nama.split(' ').forEach(w => { const ln = h('div', '', nm); [...w].forEach(c => S.L.push(h('span', '', ln, 'display:inline-block', c))); });
    const lines = [[INFO.nama_penuh || '', 'font-size:46px;color:#3b2a3f;height:62px;margin-top:20px'], [INFO.lahir ? 'Lahir ' + INFO.lahir : '', 'font-size:38px;color:#e8628e;height:52px;margin-top:8px'], [`${MAN.length} ilustrasi kartun · 19 bulan kenangan`, 'font-size:30px;color:#8a7385;height:44px;margin-top:8px']];
    S.sub = lines.filter(l => l[0]).map(([t, st]) => { const m = h('div', 'mask N8', box, st); return h('span', '', m, '', t); });
    EV.push({ t: S.t0 + .4, type: 'outro' });
  },
  draw(S, lt) {
    const c = S.cx; c.clearRect(0, 0, W, H); const cw = W / 6, ch = H / 13;
    S.tiles.forEach(o => {
      const x = (o.c + .5) * cw, y = (o.r + .5) * ch, d = Math.hypot(x - 540, y - 960) / 1100, k = eOut(clamp((lt - .2 - d * 1.6) / .5));
      if (k <= 0 || !o.im.complete) return;
      const sc = Math.min((cw - 14) / o.it.w, (ch - 14) / o.it.h) * lerp(.4, 1, k);
      c.globalAlpha = .38 * k; c.drawImage(o.im, x - o.it.w * sc / 2, y - o.it.h * sc / 2, o.it.w * sc, o.it.h * sc);
    });
    c.globalAlpha = 1; const rg = c.createRadialGradient(540, 960, 0, 540, 960, 760); rg.addColorStop(0, 'rgba(255,247,238,.97)'); rg.addColorStop(.6, 'rgba(255,247,238,.85)'); rg.addColorStop(1, 'rgba(255,247,238,0)');
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
    S.L.forEach((sp, i) => { const a = spring(lt - .8 - i * .06, 1.9, .55); sp.style.transform = `translateY(${(1 - a) * 120}px) scale(${.6 + .4 * a})`; sp.style.opacity = clamp((lt - .8 - i * .06) / .12); });
    S.sub.forEach((sp, j) => { const a = spring(lt - 1.8 - j * .25, 1.6, .75); sp.style.transform = `translateY(${(1 - a) * 105}%)`; });
  } });

// ================= pembinaan & jadual =================
const chip = document.getElementById('chip'), CA = document.getElementById('ca'), CB = document.getElementById('cb');
let AGES = [];
function buildAll() {
  for (const it of MAN) { const k = it.age || 'Keluarga'; (G[k] = G[k] || []).push(it); }
  let t = 0;
  sceneDefs.forEach((d, i) => {
    const S = { def: d, i, t0: t, t1: t + d.beats * B, el: h('div', 'scene', scenesEl, `z-index:${i + 1}`) };
    d.build(S); SC.push(S); t = S.t1;
    if (i) EV.push({ t: S.t0, type: 'trans', kind: d.tin[0] });
    if (d.cap) {                                   // sarikata cerita
      const cap = h('div', 'cap', document.getElementById('caps')), pill = h('div', 'pill', cap);
      S.capEl = cap; S.pill = pill; if (d.capTop) { cap.style.bottom = 'auto'; cap.style.top = '230px'; } S.words = (INFO['cap_' + d.name] || d.cap).split(' ').map(w => h('span', 'w', pill, '', w + '&nbsp;'));
    }
    (d.ages || []).forEach(([b, lab, m0, m1]) => AGES.push({ t: S.t0 + b * B, lab, m0, m1 }));
  });
  TOTAL = t + 0.6;
  AGES.sort((a, b) => a.t - b.t);
  buildTL();
}

// garis masa umur 0-19 bulan
const TLX0 = 150, TLX1 = 930, TLY = 1850, mx = m => TLX0 + (TLX1 - TLX0) * m / 19;
let TLE = {};
function buildTL() {
  const sv = document.getElementById('tl'); TLE.g = s('g', {}, sv);
  s('line', { x1: TLX0, x2: TLX1, y1: TLY, y2: TLY, stroke: 'rgba(255,255,255,.85)', 'stroke-width': 10, 'stroke-linecap': 'round' }, TLE.g);
  TLE.fill = s('line', { x1: TLX0, x2: TLX0, y1: TLY, y2: TLY, stroke: '#f6a8c0', 'stroke-width': 6, 'stroke-linecap': 'round' }, TLE.g);
  [[0, 'Lahir'], [6, '6'], [12, '1 thn'], [19, '1 thn 7 bln']].forEach(([m, l]) => { const tx = s('text', { x: mx(m), y: TLY - 16, 'text-anchor': 'middle', 'font-family': 'Nunito', 'font-weight': 800, 'font-size': 17, fill: 'rgba(59,42,63,.6)' }, TLE.g); tx.textContent = l; });
  TLE.dot = s('rect', { x: TLX0, y: TLY - 10, width: 20, height: 20, rx: 10, fill: '#e8628e', stroke: '#fff', 'stroke-width': 3 }, TLE.g);
}
const MW = {};
function measure(txt) { if (!(txt in MW)) { const m = document.getElementById('meas'); m.textContent = txt; MW[txt] = m.offsetWidth + 4; } return MW[txt]; }
function ageState(t) {
  let cur = null, prev = null; for (const a of AGES) if (a.t <= t) { prev = cur; cur = a; }
  return { cur, prev };
}
function drawOverlay(t) {
  const { cur, prev } = ageState(t);
  const hideS = SC.find(S => S.def.hideChip && t >= S.t0);
  const vis = cur ? clamp((t - SC[1].t0 - .3) / .5) * (hideS ? 1 - clamp((t - hideS.t0) / .5) : 1) : 0;
  chip.style.opacity = vis; TLE.g.setAttribute('opacity', vis);
  chip.style.transform = `translateY(${(1 - eOut(clamp((t - SC[1].t0 - .3) / .5))) * -30}px)`;
  if (cur) {
    const k = spring(t - cur.t, 2, .75);
    CB.textContent = cur.lab; CA.textContent = prev ? prev.lab : '';
    CA.style.transform = `translateY(${-k * 110}%)`; CB.style.transform = `translateY(${(1 - k) * 110}%)`;
    const wa = prev ? measure(prev.lab) : 0, wb = measure(cur.lab);
    document.getElementById('cv').style.width = lerp(wa || wb, wb, eIO(clamp((t - cur.t) / .45))) + 'px';
    const e = eIO(clamp((t - cur.t) / .6)), p0 = prev || cur;
    const a = lerp(p0.m0, cur.m0, e), b = lerp(p0.m1, cur.m1, e);
    TLE.dot.setAttribute('x', mx(a) - 10); TLE.dot.setAttribute('width', mx(b) - mx(a) + 20); TLE.fill.setAttribute('x2', mx(b));
  }
  // sarikata
  SC.forEach(S => {
    if (!S.capEl) return;
    const c0 = S.t0 + S.def.capAt * B, c1 = S.t1 - .35, on = t >= c0 - .05 && t < c1 + .5;
    S.capEl.style.display = on ? 'block' : 'none'; if (!on) return;
    const out = eIn(clamp((t - c1) / .4));
    const pa = spring(t - c0, 2, .7);
    S.pill.style.transform = `translateY(${(1 - pa) * 40 + out * 30}px) scale(${lerp(.9, 1, pa)})`; S.pill.style.opacity = clamp((t - c0) / .2) * (1 - out);
    S.words.forEach((w, i) => { const a = spring(t - c0 - .15 - i * .07, 2, .7); w.style.transform = `translateY(${(1 - a) * 24}px)`; w.style.opacity = clamp((t - c0 - .15 - i * .07) / .15); });
  });
}

// peralihan antara bab
function applyTrans(t) {
  let flash = 0;
  SC.forEach((S, i) => {
    const nx = SC[i + 1], nd = nx ? nx.def.tin[1] : 0;
    const vis = t >= S.t0 && t < S.t1 + nd + .001;
    S.el.style.display = vis ? 'block' : 'none'; if (!vis) return;
    let tf = '', op = 1, clip = 'none', filt = 'none';
    const [ty, du] = S.def.tin;
    if (du > 0 && t < S.t0 + du) {
      const k = clamp((t - S.t0) / du), e = eIO(k);
      if (ty === 'fade') op = e;
      if (ty === 'iris') clip = `circle(${e * 1150}px at 540px 960px)`;
      if (ty === 'wipe') clip = `inset(0 ${(1 - e) * 100}% 0 0)`;
      if (ty === 'pushUp') tf = `translateY(${(1 - e) * 100}%)`;
      if (ty === 'pushLeft') tf = `translateX(${(1 - e) * 100}%)`;
      if (ty === 'whip') { tf = `translateX(${(1 - e) * 100}%)`; filt = `blur(${Math.sin(Math.PI * k) * 24}px)`; }
      if (ty === 'zoom') { tf = `scale(${lerp(.82, 1, e)})`; op = e; }
      if (ty === 'flash') { op = k > .5 ? 1 : 0; flash = Math.max(flash, 1 - Math.abs(2 * k - 1)); }
    }
    if (nx && t >= nx.t0) {                        // kesan keluar
      const k = clamp((t - nx.t0) / nd), e = eIO(k), ny = nx.def.tin[0];
      if (ny === 'pushUp') tf = `translateY(${-e * 100}%)`;
      if (ny === 'pushLeft') tf = `translateX(${-e * 100}%)`;
      if (ny === 'whip') { tf = `translateX(${-e * 100}%)`; filt = `blur(${Math.sin(Math.PI * k) * 24}px)`; }
      if (ny === 'zoom') { tf = `scale(${lerp(1, 2.2, e)})`; op = 1 - e; }
    }
    S.el.style.transform = tf; S.el.style.opacity = op; S.el.style.clipPath = clip; S.el.style.filter = filt;
  });
  flash = Math.max(flash, clamp((t - TOTAL + .9) / .8));
  document.getElementById('flash').style.opacity = flash;
}

function seek(t) {
  applyTrans(t);
  SC.forEach((S, i) => { if (S.el.style.display !== 'none') S.def.draw(S, t - S.t0); });
  drawOverlay(t);
  const fs = SC.find(S => S.def.name === 'keluarga') || SC[SC.length - 1];   // tanda kartun disorok bila foto sebenar dipapar
  document.getElementById('tag').style.opacity = clamp((t - 6) / .5) * (1 - clamp((t - fs.t0) / .5));
}

window.ready = (async () => {
  MAN = await (await fetch('assets/manifest.json')).json();
  INFO = { nama: 'Humaira', nama_penuh: '', lahir: '', setahun: '' };
  try { Object.assign(INFO, await (await fetch('assets/info.json')).json()); } catch (e) {}
  if (INFO.buang) MAN = MAN.filter(it => !INFO.buang.includes(it.n));      // gambar yang dibuang pengguna
  buildAll();
  await document.fonts.ready;
  await Promise.all([...document.querySelectorAll('img')].map(i => i.decode().catch(() => 0)));
  await Promise.all(SC[SC.length - 1].tiles.map(o => o.im.decode().catch(() => 0)));
  seek(0);
  return { total: TOTAL, events: EV.sort((a, b) => a.t - b.t), scenes: SC.map(S => [S.def.name, S.t0, S.t1]) };
})();
</script>
