<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Kisah tumbesaran 9:16</title>
<style>
@font-face { font-family: Fredoka; font-weight: 500; src: url(assets/fonts/fredoka-latin-500-normal.woff2); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(assets/fonts/fredoka-latin-600-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 700; src: url(assets/fonts/nunito-latin-700-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 800; src: url(assets/fonts/nunito-latin-800-normal.woff2); }
:root { --ink: #3b2a3f; --soft: #8a7385; --pink: #e8628e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff7ee; }
#stage, .scene, .fill, #scenes, .flood { position: absolute; inset: 0; overflow: hidden; }
#scenes { z-index: 0; }
#fg, #vig, #tl, #caps, #chip, #tag { z-index: 2; }
#flash { z-index: 3; }
.scene, .flood { display: none; transform-origin: 50% 50%; }
.abs { position: absolute; left: 0; top: 0; }
img.st { position: absolute; left: 0; top: 0; transform-origin: 50% 55%; }
.F6 { font-family: Fredoka; font-weight: 600; }
.N8 { font-family: Nunito; font-weight: 800; }
.mask { overflow: hidden; display: block; }
.mask > span { display: inline-block; }
.pol { position: absolute; left: 0; top: 0; width: 300px; height: 372px; background: #fff; border-radius: 6px; padding: 14px 14px 0;
  box-shadow: 0 18px 30px rgba(80,50,40,.22), 0 2px 4px rgba(80,50,40,.15); transform-origin: 50% 40%; }
.pol .ph { width: 272px; height: 280px; border-radius: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pol .ph img { max-width: 112%; max-height: 112%; }
.pol .lb { font: 500 19px/1 Fredoka; color: #7a6672; text-align: center; margin-top: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tape { position: absolute; left: 100px; top: -16px; width: 100px; height: 32px; background: rgba(255,214,120,.65); transform: rotate(-4deg); }
.card { position: absolute; left: 0; top: 0; width: 320px; height: 380px; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: 0 16px 30px rgba(60,30,50,.18); border: 8px solid #fff; }
.face img { max-width: 100%; max-height: 104%; }
.face.back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, #f8a3bd 0 18px, #fbc3d3 18px 36px); }
.badge { position: absolute; left: 0; top: 0; width: 260px; height: 260px; border-radius: 50%; background: #fff; border: 10px solid var(--pink);
  box-shadow: 0 18px 36px rgba(60,30,50,.25); text-align: center; color: var(--pink); }
#chip { position: absolute; left: 48px; top: 120px; padding: 16px 28px 18px; background: rgba(255,255,255,.93); border-radius: 26px; box-shadow: 0 10px 28px rgba(60,30,50,.14); transform-origin: 0 50%; }
#chip .k { font: 800 19px/1 Nunito; letter-spacing: .3em; color: var(--pink); }
#chip .v { position: relative; height: 56px; margin-top: 6px; overflow: hidden; }
#chip .v span { position: absolute; left: 0; top: 0; font: 600 48px/56px Fredoka; color: var(--ink); white-space: nowrap; }
.cap { position: absolute; left: 0; width: 1080px; bottom: 210px; text-align: center; display: none; }
.cap .pill { display: inline-block; padding: 20px 38px 24px; background: rgba(255,255,255,.94); border-radius: 44px; box-shadow: 0 12px 34px rgba(60,30,50,.16);
  font: 800 44px/1.34 Nunito; color: var(--ink); max-width: 980px; }
.cap .w { display: inline-block; }
.cap .hl { color: #d94a7c; background-image: linear-gradient(transparent 60%, #ffe27a 60%); background-repeat: no-repeat; background-size: 0% 100%; }
#tag { position: absolute; right: 44px; top: 142px; font: 800 18px/1 Nunito; letter-spacing: .14em; color: rgba(59,42,63,.5); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(60,30,40,.15) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <canvas id="fg" class="abs" width="1080" height="1920"></canvas>
  <div id="vig"></div>
  <svg id="tl" class="abs" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="caps"></div>
  <div id="chip"><div class="k">UMUR</div><div class="v" id="cv"><span id="ca"></span><span id="cb"></span></div></div>
  <span id="meas" style="position:absolute;left:-9999px;top:0;font:600 48px/56px Fredoka;white-space:nowrap"></span>
  <div id="tag">ILUSTRASI KARTUN</div>
  <div id="flash"></div>
</div>
<script>
'use strict';
// ================= alat asas =================
const W = 1080, H = 1920, B = 60 / 96;      // 96 BPM
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = k => k * k * (3 - 2 * k);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eIn = k => k * k * k, eOut = k => 1 - Math.pow(1 - k, 3);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const smax = (c, a) => (c + Math.sqrt(c * c + a * a)) / 2;       // max(c,0) yang licin
function spring(t, f = 2.2, z = .55) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t));
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], k))).join(',')})`; }
function h(tag, cls, parent, style = '', html = '') {
  const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html) e.innerHTML = html;
  if (parent) parent.appendChild(e); return e;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, at, parent) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function img(it, parent) { const e = h('img', 'st', parent); e.src = it.file; e.width = it.w; e.height = it.h; return e; }
function put(e, it, x, y, sc, rot = 0, op = 1, extra = '') {
  if (op <= 0.002) { e.style.display = 'none'; return; }
  e.style.display = 'block'; e.style.opacity = op;
  e.style.transform = `translate(${x - it.w / 2}px,${y - it.h / 2}px) rotate(${rot}deg) scale(${sc})${extra}`;
}
const fit = (it, hh, ww = 9999) => Math.min(hh / it.h, ww / it.w);
function maskWords(parent, text, cls, style = '') {
  return text.split(' ').map(w => { const m = h('span', 'mask ' + (cls || ''), parent, 'display:inline-block;' + style); h('span', '', m, '', w + '&nbsp;'); return m.firstChild; });
}
function cv(S) { const c = h('canvas', 'abs', S.el); c.width = W; c.height = H; return c.getContext('2d'); }

// ================= data =================
let MAN, INFO, G = {}, SC = [], EV = [], BLUR = [], TOTAL = 0;
const scenesEl = document.getElementById('scenes');
const sceneDefs = [];
function def(o) { sceneDefs.push(o); }
const FLAME = [540, 845];                      // kedudukan api lilin di atas angka 1

// ---------- 0. Pembukaan: subuh + gambar kecil mengelilingi tajuk ----------
def({ name: 'buka', beats: 10, tin: ['none', 0],
  build(S) {
    S.cx = cv(S);
    const pool = MAN.filter(it => it.age), n = 12;
    S.tz = Array.from({ length: n }, (_, i) => { const it = pool[Math.round(i * (pool.length - 1) / (n - 1))], j = Math.floor(i / 2);
      return { it, im: img(it, S.el), ang: (i % 2 ? 1 : -1) * (40 + j * 20) * Math.PI / 180, d: 2.0 + i * 0.1 }; });
    S.tz.forEach((o, i) => EV.push({ t: S.t0 + o.d, type: 'tick', k: i }));
    const box = h('div', 'abs', S.el, 'width:1080px;top:650px;text-align:center');
    S.k = h('div', 'N8', box, 'font-size:32px;letter-spacing:.6em;color:#fff;opacity:0', 'KISAH');
    const nm = h('div', 'F6', box, 'font-size:200px;line-height:1.05;margin-top:16px');
    S.L = []; INFO.nama.split(' ').forEach(w => { const ln = h('div', '', nm); [...w].forEach(c => S.L.push(h('span', '', ln, 'display:inline-block', c))); });
    const sb = h('div', 'mask N8', box, 'font-size:42px;margin-top:22px;height:58px');
    S.sub = h('span', '', sb, '', INFO.lahir ? 'Lahir ' + INFO.lahir : 'Baru lahir hingga 1 tahun 7 bulan');
    EV.push({ t: S.t0 + 1.0, type: 'title' });
  },
  draw(S, lt) {
    const c = S.cx, p = eIO(clamp(lt / 5.0));
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix('#2b1d3a', '#ffe9e4', p)); g.addColorStop(.6, mix('#5b2f55', '#fff1e6', p)); g.addColorStop(1, mix('#8a4a62', '#fff7ee', p));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const sy = lerp(2200, 1250, eOut(clamp(lt / 4.6)));
    const rg = c.createRadialGradient(540, sy, 0, 540, sy, 1100);
    rg.addColorStop(0, 'rgba(255,214,140,.95)'); rg.addColorStop(.25, 'rgba(255,190,150,.5)'); rg.addColorStop(1, 'rgba(255,190,150,0)');
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 50; i++) {
      const x = rnd(i) * W + Math.sin(lt * .6 + i) * 20, y = ((rnd(i + 50) * H * 1.2) - lt * (30 + rnd(i + 9) * 50)) % (H * 1.2);
      const yy = y < -60 ? y + H * 1.2 : y, r = 6 + rnd(i + 3) * 26;
      c.globalAlpha = (.12 + .18 * rnd(i + 4)) * (.6 + .4 * Math.sin(lt * 2 + i));
      c.fillStyle = i % 3 ? '#ffd9a8' : '#ffc2d6'; c.beginPath(); c.arc(x, yy, r, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
    const lk = clamp((lt - 2.6) / 2.4);
    if (lk > 0 && lk < 1) {
      const y = lerp(-600, 2500, lk), lg = c.createLinearGradient(0, y - 400, 0, y + 400);
      lg.addColorStop(0, 'rgba(255,240,220,0)'); lg.addColorStop(.5, 'rgba(255,240,220,.35)'); lg.addColorStop(1, 'rgba(255,240,220,0)');
      c.fillStyle = lg; c.fillRect(0, 0, W, H);
    }
    const col = mix('#ffffff', '#3b2a3f', clamp((lt - 1.4) / 2)), out = eIn(clamp((lt - 5.2) / 0.6));
    S.tz.forEach((o, i) => { const tp = lt - o.d, sp = spring(tp, 2.2, .5), a = o.ang + Math.sin(lt * .5 + i) * .05;
      put(o.im, o.it, 540 + 430 * Math.cos(a), 940 + 700 * Math.sin(a) + Math.sin(lt * 1.6 + i) * 8, fit(o.it, 215, 230) * sp * (1 - out * .4), Math.sin(lt + i) * 5, clamp(tp / .12) * (1 - out)); });
    S.k.style.opacity = clamp((lt + .2) / 0.6) * (1 - out); S.k.style.color = mix('#ffffff', '#e8628e', clamp((lt - 1.4) / 2));
    S.L.forEach((sp, i) => {
      const a = spring(lt - .7 - i * 0.07, 1.9, .55);
      sp.style.color = col; sp.style.opacity = clamp((lt - .7 - i * .07) / .15) * (1 - out);
      sp.style.transform = `translateY(${(1 - a) * -140 - out * 80}px) rotate(${(1 - a) * (i % 2 ? 14 : -14)}deg)`;
      sp.style.filter = `blur(${(1 - clamp((lt - .7 - i * .07) / .3)) * 8}px)`;
    });
    const a = spring(lt - 1.9, 1.6, .75);
    S.sub.style.transform = `translateY(${(1 - a) * 100 - out * 100}%)`; S.sub.style.color = mix('#f3d4e0', '#8a7385', clamp((lt - 1.4) / 2));
  } });

// ---------- 1. Hari pertama: mainan gantung + cap tarikh ----------
def({ name: 'lahir', beats: 10, tin: ['fade', 1.0], cap: 'Seorang *puteri *kecil lahir ke dunia.', capAt: 3,
  ages: [[0, 'Baru Lahir', 0, 0]],
  build(S) {
    S.el.style.background = 'radial-gradient(circle at 50% 58%, #fff8f2 0%, #ffe6ee 55%, #f7cfe0 100%)';
    S.halo = h('div', 'abs', S.el, 'width:1040px;height:1040px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.75) 40%,rgba(255,255,255,0) 70%)');
    S.cx = cv(S);
    const sv = s('svg', { width: 1080, height: 1920, class: 'abs' }, S.el), root = s('g', { transform: 'translate(0 60)' }, sv);
    s('path', { d: 'M540 -60 L540 205 M250 300 Q540 110 830 300', fill: 'none', stroke: '#c9a98f', 'stroke-width': 8, 'stroke-linecap': 'round' }, root);
    const SH = { star: 'M0 -34 L10 -11 L34 -11 L15 5 L22 30 L0 15 L-22 30 L-15 5 L-34 -11 L-10 -11 Z', heart: 'M0 -18 C -20 -40 -44 -16 0 22 C 44 -16 20 -40 0 -18 Z',
      moon: 'M14 -32 A34 34 0 1 0 14 32 A26 26 0 1 1 14 -32 Z', cloud: 'M-34 16 a18 18 0 0 1 6 -34 a24 24 0 0 1 44 -4 a17 17 0 0 1 14 38 Z' };
    S.mob = [[250, 300, 170, 'star', '#ffd36e'], [395, 229, 330, 'cloud', '#ffffff'], [540, 205, 200, 'moon', '#ffe08a'], [685, 229, 345, 'heart', '#f58fae'], [830, 300, 170, 'star', '#bfa5f5']].map(([x, y, len, shape, col], i) => {
      const g = s('g', {}, root); s('line', { x1: 0, y1: 0, x2: 0, y2: len, stroke: '#c9a98f', 'stroke-width': 3 }, g);
      s('path', { d: SH[shape], fill: col, stroke: '#fff', 'stroke-width': 3, 'stroke-linejoin': 'round' }, s('g', { transform: `translate(0 ${len + 40}) scale(1.6)` }, g));
      return { g, x, y, ph: i * 1.3, w: 1.1 + i * .13 }; });
    S.it = G['Baru Lahir'][0]; S.im = img(S.it, S.el);
    // cap tarikh bulat
    const parts = (INFO.lahir || '').split(' ');
    S.st = s('g', {}, s('svg', { width: 1080, height: 1920, class: 'abs' }, S.el));
    s('circle', { r: 132, fill: '#fff', stroke: '#e8628e', 'stroke-width': 8 }, S.st); s('circle', { r: 114, fill: 'none', stroke: '#e8628e', 'stroke-width': 2.5, 'stroke-dasharray': '3 8' }, S.st);
    s('path', { id: 'arcT', d: 'M -90 2 A 90 90 0 0 1 90 2', fill: 'none' }, S.st);
    const tp = s('textPath', { href: '#arcT', startOffset: '50%' }, s('text', { 'text-anchor': 'middle', 'font-family': 'Nunito', 'font-weight': 800, 'font-size': 21, 'letter-spacing': 5, fill: '#e8628e' }, S.st)); tp.textContent = 'HARI PERTAMA';
    const big = s('text', { y: 42, 'text-anchor': 'middle', 'font-family': 'Fredoka', 'font-weight': 600, 'font-size': 104, fill: '#e8628e' }, S.st); big.textContent = parts[0] || '1';
    const sm = s('text', { y: 84, 'text-anchor': 'middle', 'font-family': 'Nunito', 'font-weight': 800, 'font-size': 27, 'letter-spacing': 2, fill: '#3b2a3f' }, S.st);
    sm.textContent = parts.length > 2 ? parts[1].slice(0, 3).toUpperCase() + ' ' + parts[2] : 'HARI';
    EV.push({ t: S.t0 + B, type: 'pop', k: 0 }); EV.push({ t: S.t0 + 2.35, type: 'stamp' });
  },
  draw(S, lt) {
    const pulse = 1 + .035 * Math.sin(lt * 2.2);
    S.halo.style.transform = `translate(${540 - 520}px,${1140 - 520}px) scale(${pulse * clamp(spring(lt - .4, 1.2, .8))})`;
    S.mob.forEach((o, i) => { const d = spring(lt - .2 - i * .09, 1.5, .55); o.g.setAttribute('transform', `translate(${o.x} ${o.y}) rotate(${Math.sin(lt * o.w + o.ph) * 9}) scale(1 ${d})`); });
    const tp = lt - B, sp = spring(tp, 1.5, .7), kb = 1 + 0.07 * clamp(lt / 6.25);
    put(S.im, S.it, 540, 1150 + (1 - sp) * 80 + Math.sin(lt * 1.3) * 6, fit(S.it, 800, 860) * kb * lerp(.88, 1, sp), -3 + lt * .5, clamp(tp / .5));
    const c = S.cx; c.clearRect(0, 0, W, H);
    for (let i = 0; i < 36; i++) {
      const x = 60 + rnd(i) * 960, y = 620 + rnd(i + 30) * 950, a = Math.max(0, Math.sin(lt * 2.5 + i * 1.7)) * clamp((lt - 1) / 1);
      const r = 7 + rnd(i + 5) * 13; c.globalAlpha = a * .85; c.fillStyle = i % 2 ? '#ffffff' : '#ffd36e';
      c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r); c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill();
    }
    c.globalAlpha = 1;
    const ts = lt - 2.2, k = clamp(ts / .16), wob = ts > .16 ? Math.sin((ts - .16) * 30) * Math.exp(-(ts - .16) * 9) * 5 : 0;
    S.st.setAttribute('opacity', clamp(ts / .07)); S.st.setAttribute('transform', `translate(852 800) rotate(${-13 + wob}) scale(${1 + 1.5 * (1 - k) * (1 - k)})`);
  } });

// ---------- 2. Bulan-bulan awal: polaroid, kamera turun ----------
def({ name: 'polaroid', beats: 20, tin: ['pushUp', .8], cap: 'Bulan-bulan awal: banyak tidur, sesekali menangis, dan *senyuman *pertama.', capAt: 2,
  ages: [[0, 'Bawah 7 Bulan', 0, 6.9]],
  build(S) {
    S.el.style.background = 'repeating-linear-gradient(115deg,#f3e4d0 0 22px,#f0dfc8 22px 44px)';
    S.world = h('div', 'abs', S.el, 'width:1080px;height:3840px');
    const PAL = ['#ffe1e8', '#e0f2ff', '#e8f7e2', '#f1e6ff', '#fff2d6', '#ffe8dc'];
    for (let i = 0; i < 30; i++) h('div', 'abs', S.world, `left:${rnd(i + 70) * 1060}px;top:${rnd(i + 90) * 3800}px;width:${10 + rnd(i) * 14}px;height:${10 + rnd(i) * 14}px;border-radius:50%;background:${['#f6b7c8', '#a9d6f5', '#bfe5b5', '#ffd27e'][i % 4]};opacity:.55`);
    S.title = h('div', 'abs F6', S.world, 'left:90px;top:262px;font-size:68px;color:#3b2a3f', 'Bulan-bulan awal');
    S.und = s('path', { d: 'M90 362 q 60 -14 120 0 t 120 0 t 120 0 t 120 0', fill: 'none', stroke: '#e8628e', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': 520, 'stroke-dashoffset': 520 }, s('svg', { width: 1080, height: 460, class: 'abs' }, S.world));
    S.items = G['Bawah 7 Bulan'].map((it, k) => {
      const r = Math.floor(k / 2), col = k % 2;
      const card = h('div', 'pol', S.world); const ph = h('div', 'ph', card, `background:${PAL[k % PAL.length]}`);
      const im = h('img', '', ph); im.src = it.file; h('div', 'lb', card, '', it.desc); h('div', 'tape', card, `transform:rotate(${(rnd(k + 3) - .5) * 14}deg)`);
      EV.push({ t: S.t0 + (2 + k) * B, type: 'pop', k });
      return { card, X: col ? 765 : 315, Y: 650 + r * 440 + col * 200, r: (rnd(k * 3.3) - .5) * 14, pop: (2 + k) * B };
    });
  },
  draw(S, lt) {
    const camY = 1960 * sstep(clamp((lt - 2 * B) / (14 * B)));
    S.world.style.transform = `translateY(${-camY}px)`;
    S.items.forEach(o => {
      const tp = lt - o.pop; if (tp < 0) { o.card.style.display = 'none'; return; }
      const sp = spring(tp, 2.3, .5); o.card.style.display = 'block'; o.card.style.opacity = clamp(tp / .12);
      o.card.style.transform = `translate(${o.X - 150}px,${o.Y - 186 - (1 - sp) * 60}px) rotate(${o.r + (1 - sp) * 18}deg) scale(${lerp(1.5, 1, sp) * 1.2})`;
    });
    const a = spring(lt - .5, 1.6, .7); S.title.style.transform = `translateX(${(1 - a) * 60}px)`; S.title.style.opacity = clamp((lt - .5) / .3);
    S.und.setAttribute('stroke-dashoffset', 520 * (1 - eOut(clamp((lt - .9) / .8))));
  } });

// ---------- 3. 7 bulan: panel 2x2 + lencana ----------
def({ name: 'panel', beats: 10, tin: ['wipe', .8], cap: '*Tujuh *bulan. Sudah pandai duduk dan bergaya.', capAt: 2,
  ages: [[0, '7 Bulan', 7, 7]],
  build(S) {
    S.el.style.background = '#fff7ee';
    const COL = ['#ffd6c9', '#cfeedd', '#e3d7f7', '#d3e8fb'], its = G['7 Bulan'];
    S.p = its.map((it, k) => {
      const pw = 540, ph = 960, px = (k % 2) * pw, py = Math.floor(k / 2) * ph;
      const pan = h('div', 'abs', S.el, `left:${px}px;top:${py}px;width:${pw + 1}px;height:${ph + 1}px;background:${COL[k % 4]};overflow:hidden`);
      h('div', 'abs', pan, `inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 5px, transparent 5.5px);background-size:54px 54px`);
      const im = img(it, pan); EV.push({ t: S.t0 + (1 + k) * B, type: 'pop', k });
      return { pan, im, it, pw, ph, pop: (1 + k) * B, top: k < 2 };
    });

      if (ty === 'fade') op = e;
      if (ty === 'flood') { S.flood.style.clipPath = `circle(${eOut(clamp(k / .6)) * 1450}px at 540px 1250px)`; clip = `circle(${eIO(clamp((k - .32) / .68)) * 1450}px at 540px 1250px)`; }
      if (ty === 'wipe') clip = `polygon(0 0, ${e * 130}% 0, ${e * 130 - 30}% 100%, 0 100%)`;
      if (ty === 'pushUp') tf = `translateY(${(1 - e) * 100}%)`;
      if (ty === 'pushLeft') tf = `translateX(${(1 - e) * 100}%)`;
      if (ty === 'whip') { tf = `translateX(${(1 - e) * 100}%)`; filt = `blur(${Math.sin(Math.PI * k) * 8}px)`; }
      if (ty === 'zoom') { tf = `scale(${lerp(.8, 1, e)})`; op = clamp(k / .5); }
      if (ty === 'flash') { op = k > .5 ? 1 : 0; flash = Math.max(flash, 1 - Math.abs(2 * k - 1)); }
    }
    if (nx && t >= nx.t0) {                        // kesan keluar
      const k = clamp((t - nx.t0) / nd), e = eIO(k), ny = nx.def.tin[0];
      if (ny === 'pushUp') tf = `translateY(${-e * 100}%)`;
      if (ny === 'pushLeft') tf = `translateX(${-e * 100}%)`;
      if (ny === 'whip') { tf = `translateX(${-e * 100}%)`; filt = `blur(${Math.sin(Math.PI * k) * 8}px)`; }
      if (ny === 'zoom') { tf = `scale(${lerp(1, 2.4, e)})`; op = 1 - clamp((k - .3) / .5); }
      if (ny === 'wipe' || ny === 'flood') tf = `scale(${1 + .05 * e})`;
    }
    S.el.style.transform = tf; S.el.style.opacity = op; S.el.style.clipPath = clip; S.el.style.filter = filt;
  });
  flash = Math.max(flash, clamp((t - TOTAL + .9) / .8));
  document.getElementById('flash').style.opacity = flash;
}

function seek(t) {
  applyTrans(t);
  SC.forEach(S => { if (S.el.style.display !== 'none') S.def.draw(S, t - S.t0); });
  drawOverlay(t); drawFg(t);
  const fs = SC.find(S => S.def.name === 'keluarga') || SC[SC.length - 1];   // tanda kartun disorok bila foto sebenar dipapar
  document.getElementById('tag').style.opacity = clamp((t - 6.6) / .5) * (1 - clamp((t - fs.t0) / .5));
}

window.ready = (async () => {
  MAN = await (await fetch('assets/manifest.json')).json();
  INFO = { nama: 'Humaira', nama_penuh: '', lahir: '', setahun: '' };
  try { Object.assign(INFO, await (await fetch('assets/info.json')).json()); } catch (e) {}
  if (INFO.buang) MAN = MAN.filter(it => !INFO.buang.includes(it.n));      // gambar yang dibuang pengguna
  buildAll();
  await document.fonts.ready;
  await Promise.all([...document.querySelectorAll('img')].map(i => i.decode().catch(() => 0)));
  await Promise.all(SC[SC.length - 1].tiles.map(o => o.im.decode().catch(() => 0)));
  seek(0);
  return { total: TOTAL, events: EV.sort((a, b) => a.t - b.t), scenes: SC.map(S => [S.def.name, S.t0, S.t1]), blur: BLUR };
})();
</script>
