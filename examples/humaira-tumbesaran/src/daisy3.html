<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><title>Kisah tumbesaran - versi ringkas</title>
<style>
@font-face{font-family:FO;src:url(assets/fonts-dd/fredoka-one-latin-400-normal.woff2)}
@font-face{font-family:QS;font-weight:600;src:url(assets/fonts-dd/quicksand-latin-600-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F5F0E6;color:#2D2D2D;font-family:FO}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none}
.abs{position:absolute;left:0;top:0}
.card{position:absolute;left:0;top:0;background:#fff;border:3px solid #2D2D2D;border-radius:24px;box-shadow:6px 6px 0 #2D2D2D;overflow:hidden;transform-origin:50% 50%}
.card img,.fit{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.lblw{position:absolute;left:0;top:96px;width:1080px;text-align:center}
.pill{display:inline-block;background:#FDE68A;border:3px solid #2D2D2D;border-radius:50px;box-shadow:4px 4px 0 #2D2D2D;font:46px/1 FO;padding:16px 38px 18px;white-space:nowrap}
.cap{position:absolute;left:70px;top:1450px;width:940px;padding:32px 40px 38px;text-align:center;font:62px/1.22 FO;border-radius:28px}
.cap .ln{display:none;text-wrap:balance}
.w{display:inline-block;margin:0 4px}
.kw{display:inline-block;background:#FDE68A;border:3px solid #2D2D2D;border-radius:50px;padding:0 16px;box-shadow:4px 4px 0 #2D2D2D;margin:0 4px}
.big{font:112px/1.05 FO;text-align:center}
.q{font:600 34px/1.3 QS}
</style></head>
<body>
<script>
'use strict';
const W = 1080, H = 1920;
const C = { cream: '#F5F0E6', turq: '#7ECDC0', pink: '#F7C8D4', butter: '#FDE68A', mint: '#A8E6CF', lav: '#D4A5E8', peach: '#FFCBA4', sky: '#A8D8F0', coral: '#F8635F', ink: '#2D2D2D' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - clamp(k), 3);
const eIO = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const eBack = k => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const HEART = '<svg width="58" height="52" viewBox="-30 -26 60 54" style="vertical-align:-8px"><path d="M0 20 C -42 -6 -20 -36 0 -14 C 20 -36 42 -6 0 20 Z" fill="#F8635F" stroke="#2D2D2D" stroke-width="3" stroke-linejoin="round"/></svg>';

// Bab: kunci teks (assets/cerita3.json), jenis susun atur, tempoh (s), gambar, warna latar
const CH = [
  { key: 'buka', kind: 'rain', dur: 8, bg: C.butter, imgs: ['001', '012', '034', '049', '060', '077'] },
  { key: 'lahir', kind: 'hero', dur: 12, bg: C.pink, imgs: ['001', '002', '003'] },
  { key: 'azan', kind: 'zoom', dur: 10, bg: C.sky, imgs: ['003'], fy: .32, moon: true },
  { key: 'lidah', kind: 'lens', dur: 9, bg: C.mint, imgs: ['004'] },
  { key: 'keluarga', kind: 'wall', dur: 10, bg: C.peach, imgs: ['KEL'] },
  { key: 'tangan', kind: 'zoom', dur: 9, bg: C.lav, imgs: ['011'], fy: .35 },
  { key: 'awal', kind: 'line', dur: 9, bg: C.turq, imgs: ['005', '008', '010', '014', '015', '016', '017'] },
  { key: 'b7', kind: 'stickers', dur: 9, bg: C.pink, imgs: ['025', '026', '027', '028'] },
  { key: 'b8', kind: 'postcard', dur: 10, bg: C.sky, imgs: ['032', '029', '033', '034', '035'] },
  { key: 'b911', kind: 'calendar', dur: 10, bg: C.butter, imgs: ['037', '038', '041', '043', '045', '048'] },
  { key: 'setahun', kind: 'party', dur: 12, bg: C.pink, imgs: ['050', '049', '052'] },
  { key: 'ketawa', kind: 'jar', dur: 10, bg: C.mint, imgs: ['060', '058', '061'] },
  { key: 'pantai', kind: 'flip', dur: 12, bg: C.turq, imgs: ['024', '023', '022', '021', '020', '019', '018'] },
  { key: 'baik', kind: 'grid', dur: 12, bg: C.lav, imgs: ['063', '066', '070', '072', '075', '077', '079'] },
  { key: 'rahsia', kind: 'secret', dur: 16, bg: C.peach, imgs: ['072'] },
  { key: 'belum', kind: 'road', dur: 10, bg: C.mint, imgs: ['KEL'] },
  { key: 'akhir', kind: 'mosaic', dur: 12, bg: C.cream, imgs: [] }
];
let T = {}, MAN = [], NAT = {}, INFO = {}, TOTAL = 0;

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmt(s) {   // teks -> HTML: *frasa* jadi satu pil, ♥ jadi hati dilukis
  return esc(s).replace(/\*([.,!?:;"]+)/g, '$1*').split(/(\*[^*]+\*)/).filter(Boolean).map(seg => {
    if (seg[0] === '*') return '<span class="w kw">' + seg.slice(1, -1).replace('♥', HEART) + '</span>';
    return seg.trim().split(/\s+/).filter(Boolean).map(w => '<span class="w">' + w.replace('♥', HEART) + '</span>').join(' ');
  }).join(' ');
}
function el(tag, cls, parent, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText += style; if (parent) parent.appendChild(e); return e; }
function svg(tag, at, parent) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function src(id) { return id === 'KEL' ? INFO.foto_keluarga[0].file : 'assets/img/' + id + '.png'; }
// letak elemen berpusat pada (cx, cy)
function setT(e, cx, cy, sc = 1, rot = 0, op = 1) {
  if (op <= .003) { e.style.display = 'none'; return; }
  e.style.display = 'block'; e.style.opacity = op;
  e.style.transform = 'translate(' + (cx - e.__w / 2).toFixed(1) + 'px,' + (cy - e.__h / 2).toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')';
}
// gambar dimuatkan (contain) ke dalam kotak (x, y, w, h) di dalam induk
function fitImg(parent, id, x, y, w, h) {
  const n = NAT[id], s = Math.min(w / n.w, h / n.h), dw = n.w * s, dh = n.h * s;
  const im = el('img', 'fit', parent); im.src = src(id); im.width = n.w; im.height = n.h;
  const o = { im, n, s, ox: x + (w - dw) / 2, oy: y + (h - dh) / 2, dw, dh };
  im.style.transform = 'translate(' + o.ox + 'px,' + o.oy + 'px) scale(' + s + ')';
  return o;
}
// kad gambar bersempadan arang
function photo(parent, id, w, h, pad = 18) {
  const d = el('div', 'card', parent, null, 'width:' + w + 'px;height:' + h + 'px');
  d.__w = w; d.__h = h;
  const f = fitImg(d, id, pad, pad, w - 6 - 2 * pad, h - 6 - 2 * pad);
  return Object.assign({ el: d, w, h }, f);
}
function box(parent, w, h, cls, html, style) { const d = el('div', cls || 'abs', parent, html, 'width:' + w + 'px;height:' + h + 'px;' + (style || '')); d.__w = w; d.__h = h; return d; }

// ---------- hiasan lukisan tangan ----------
function ornament(parent, type, x, y, s) {
  const g = svg('g', {}, parent); const i = svg('g', {}, g); const sw = 3;
  if (type === 'daisy') { for (let k = 0; k < 8; k++) svg('ellipse', { cx: 0, cy: -s * .55, rx: s * .22, ry: s * .42, transform: 'rotate(' + k * 45 + ')', fill: '#fff', stroke: C.ink, 'stroke-width': sw }, i); svg('circle', { r: s * .28, fill: C.butter, stroke: C.ink, 'stroke-width': sw }, i); }
  else if (type === 'star') { const p = []; for (let k = 0; k < 10; k++) { const a = Math.PI * k / 5 - Math.PI / 2, r = k % 2 ? s * .42 : s; p.push((r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1)); } svg('polygon', { points: p.join(' '), fill: C.butter, stroke: C.ink, 'stroke-width': sw, 'stroke-linejoin': 'round' }, i); }
  else if (type === 'sun') { for (let k = 0; k < 12; k++) { const a = Math.PI * k / 6; svg('line', { x1: Math.cos(a) * s * .7, y1: Math.sin(a) * s * .7, x2: Math.cos(a) * s, y2: Math.sin(a) * s, stroke: C.ink, 'stroke-width': sw, 'stroke-linecap': 'round' }, i); } svg('circle', { r: s * .6, fill: C.butter, stroke: C.ink, 'stroke-width': sw }, i); }
  else svg('ellipse', { rx: s, ry: s * .5, fill: '#fff', stroke: C.ink, 'stroke-width': sw }, i);
  return { g, x, y };
}
function heartPath(parent, fill) { return svg('path', { d: 'M0 20 C -42 -6 -20 -36 0 -14 C 20 -36 42 -6 0 20 Z', fill: fill || C.coral, stroke: C.ink, 'stroke-width': 3, 'stroke-linejoin': 'round' }, parent); }

// ---------- jenis susun atur ----------
const K = {};
K.rain = {   // hujan polaroid, kemudian kad tajuk
  build(S) {
    const P = [[260, 470, -8], [820, 430, 7], [540, 760, -3], [230, 1170, 6], [840, 1190, -6], [540, 1520, 4]];
    S.pol = S.imgs.map((id, i) => ({ p: photo(S.layer, id, 330, 400, 16), x: P[i][0], y: P[i][1], r: P[i][2], d: .15 + i * .2 }));
    S.tc = box(S.layer, 920, 440, 'card', '<div class="big" style="margin-top:60px">' + fmt(T.buka.title) + '</div><div style="font:66px/1.3 FO;text-align:center;margin-top:20px">' + fmt(T.buka.title2) + '</div>');
  },
  draw(S, lt) {
    S.pol.forEach(o => { const k = eBack((lt - o.d) / .65); setT(o.p.el, o.x, lerp(-320, o.y, k), 1, o.r * (3 - 2 * k), clamp((lt - o.d) / .1)); });
    const k = eBack((lt - 2.6) / .6); setT(S.tc, 540, 980, .7 + .3 * k, -2 + 2 * k, clamp((lt - 2.6) / .2));
  }
};
K.hero = {   // gambar besar, cap tarikh, pil fakta, dua polaroid kecil
  build(S) {
    S.main = photo(S.layer, S.imgs[0], 740, 860, 22);
    const d = T.lahir.date || ['', ''];
    S.stamp = box(S.layer, 270, 270, 'abs', '<div style="width:270px;height:270px;border-radius:50%;background:#fff;border:6px solid #F8635F;box-shadow:5px 5px 0 #2D2D2D;text-align:center;padding-top:34px"><div style="font:118px/1 FO;color:#F8635F;margin-top:20px">' + esc(d[0]) + '</div><div style="font:34px/1.1 FO">' + esc(d[1]) + '</div></div>');
    S.pills = (T.lahir.pills || []).map(t => box(S.layer, 0, 0, 'abs', '<span class="pill" style="background:' + C.mint + '">' + esc(t) + '</span>'));
    S.sm = S.imgs.slice(1).map((id, i) => photo(S.layer, id, 280, 340, 14));
  },
  draw(S, lt) {
    const k = eBack(lt / .7); setT(S.main.el, 540, 700, .88 + .12 * k, -3 * (1 - k), clamp(lt / .2));
    const ks = clamp((lt - 1.3) / .18), wob = lt > 1.48 ? Math.sin((lt - 1.48) * 26) * Math.exp(-(lt - 1.48) * 7) * 6 : 0;
    setT(S.stamp, 850, 300, 1 + 1.4 * (1 - ks) * (1 - ks), -12 + wob, ks);
    S.pills.forEach((p, i) => { const kp = eBack((lt - 2.4 - i * .35) / .5); p.style.display = kp > 0 ? 'block' : 'none'; p.style.transform = 'translate(' + (i ? 560 : 300) + 'px,' + (1200 + (1 - kp) * 60) + 'px) scale(' + kp + ')'; });
    S.sm.forEach((p, i) => { const kk = eOut((lt - 6.2 - i * .5) / .6); setT(p.el, i ? lerp(1300, 900, kk) : lerp(-220, 180, kk), 1130 + i * 30, 1, i ? 8 : -9, clamp((lt - 6.2 - i * .5) / .1)); });
  }
};
K.zoom = {   // zum perlahan ke titik fokus (Ken Burns)
  build(S) {
    S.p = photo(S.layer, S.imgs[0], 900, 1120, 24);
    if (S.def.moon) { const s = svg('svg', { width: 1080, height: 1920, class: 'abs' }, S.layer); S.moon = svg('g', {}, s); svg('path', { d: 'M20 -60 A62 62 0 1 0 20 60 A48 48 0 1 1 20 -60 Z', fill: C.butter, stroke: C.ink, 'stroke-width': 4 }, S.moon); const st = []; for (let k = 0; k < 10; k++) { const a = Math.PI * k / 5 - Math.PI / 2, r = k % 2 ? 11 : 26; st.push((70 + r * Math.cos(a)).toFixed(1) + ',' + (-40 + r * Math.sin(a)).toFixed(1)); } svg('polygon', { points: st.join(' '), fill: C.butter, stroke: C.ink, 'stroke-width': 3 }, S.moon); }
  },
  draw(S, lt) {
    const k = eBack(lt / .7); setT(S.p.el, 540, 790, .9 + .1 * k, 2 * (1 - k), clamp(lt / .2));
    const z = 1 + .22 * eIO(lt / S.def.dur), p = S.p, fx = p.ox + p.dw * .5, fy = p.oy + p.dh * (S.def.fy || .4);
    p.im.style.transform = 'translate(' + fx + 'px,' + fy + 'px) scale(' + z + ') translate(' + (-fx) + 'px,' + (-fy) + 'px) translate(' + p.ox + 'px,' + p.oy + 'px) scale(' + p.s + ')';
    if (S.moon) { const km = eBack((lt - 1) / .6); S.moon.setAttribute('transform', 'translate(860 300) scale(' + km.toFixed(3) + ') rotate(' + (Math.sin(lt * 1.2) * 4).toFixed(2) + ')'); }
  }
};
K.lens = {   // kanta pembesar bergerak ke wajah
  build(S) {
    S.p = photo(S.layer, S.imgs[0], 780, 1040, 22);
    S.R = 150; S.M = 2.1;
    S.lens = box(S.layer, 2 * S.R, 2 * S.R, 'abs', '', 'border-radius:50%;overflow:hidden;border:9px solid #2D2D2D;background:#fff;box-shadow:6px 6px 0 #2D2D2D');
    S.limg = el('img', 'fit', S.lens); S.limg.src = src(S.imgs[0]); S.limg.width = S.p.n.w; S.limg.height = S.p.n.h;
    S.handle = box(S.layer, 40, 200, 'abs', '', 'background:#F8635F;border:4px solid #2D2D2D;border-radius:20px;transform-origin:50% 0');
  },
  draw(S, lt) {
    const k = eBack(lt / .7), cx = 540, cy = 770; setT(S.p.el, cx, cy, .9 + .1 * k, 0, clamp(lt / .2));
    const p = S.p, x0 = cx - p.w / 2 + 3, y0 = cy - p.h / 2 + 3;          // sudut kandungan kad
    const fx = p.ox + p.dw * .5, fy = p.oy + p.dh * .27;                    // titik wajah dalam kad
    const m = eIO((lt - 1.0) / 1.6), wig = clamp((lt - 2.6) / .5);
    const lx = lerp(p.w + 60, fx, m) + Math.sin(lt * 2.1) * 18 * wig, ly = lerp(p.h + 80, fy, m) + Math.cos(lt * 1.7) * 14 * wig;
    const vis = clamp((lt - .9) / .2), R = S.R, M = S.M;
    S.lens.style.display = vis > 0 ? 'block' : 'none'; S.lens.style.opacity = vis;
    S.lens.style.transform = 'translate(' + (x0 + lx - R) + 'px,' + (y0 + ly - R) + 'px)';
    S.limg.style.transform = 'translate(' + (R - 9) + 'px,' + (R - 9) + 'px) scale(' + M + ') translate(' + (-lx) + 'px,' + (-ly) + 'px) translate(' + p.ox + 'px,' + p.oy + 'px) scale(' + p.s + ')';
    S.handle.style.display = vis > 0 ? 'block' : 'none'; S.handle.style.opacity = vis;
    S.handle.style.transform = 'translate(' + (x0 + lx + R * .62 - 20) + 'px,' + (y0 + ly + R * .62) + 'px) rotate(-45deg)';
  }
};
K.wall = {   // foto tergantung pada tali, berayun perlahan
  build(S) {
    const s = svg('svg', { width: 1080, height: 1920, class: 'abs' }, S.layer);
    svg('path', { d: 'M -20 250 Q 540 330 1100 250', fill: 'none', stroke: C.ink, 'stroke-width': 5 }, s);
    S.strings = [svg('line', { stroke: C.ink, 'stroke-width': 4 }, s), svg('line', { stroke: C.ink, 'stroke-width': 4 }, s)];
    S.pins = [svg('circle', { r: 16, fill: C.coral, stroke: C.ink, 'stroke-width': 4 }, s), svg('circle', { r: 16, fill: C.coral, stroke: C.ink, 'stroke-width': 4 }, s)];
    S.p = photo(S.layer, S.imgs[0], 900, 650, 20); S.p.el.style.transformOrigin = '50% 0';
    const hs = svg('svg', { width: 1080, height: 1920, class: 'abs' }, S.layer); S.hearts = [];
    for (let k = 0; k < 9; k++) { const g = svg('g', {}, hs); heartPath(g, [C.coral, C.pink, '#fff'][k % 3]); S.hearts.push({ g, x: 80 + rnd(k + 40) * 920, d: .8 + rnd(k + 41) * 4, v: 150 + rnd(k + 42) * 120, s: .6 + rnd(k + 43) * .6 }); }
  },
  draw(S, lt) {
    const drop = eBack(lt / .8), rot = 3 * Math.sin(lt * 1.7) * Math.exp(-lt * .25), top = lerp(-700, 400, drop);
    const e = S.p.el; e.style.display = 'block'; e.style.transform = 'translate(90px,' + top + 'px) rotate(' + rot + 'deg)';
    const a = rot * Math.PI / 180, ax = [300, 780];
    ax.forEach((x, i) => { const dx = x - 540, px = 540 + dx * Math.cos(a), py = top + dx * Math.sin(a); S.strings[i].setAttribute('x1', x); S.strings[i].setAttribute('y1', 288); S.strings[i].setAttribute('x2', px); S.strings[i].setAttribute('y2', py + 4); S.pins[i].setAttribute('cx', x); S.pins[i].setAttribute('cy', 288); });
    S.hearts.forEach(h => { const tt = lt - h.d; h.g.setAttribute('transform', 'translate(' + (h.x + Math.sin(tt * 1.5 + h.x) * 24) + ' ' + (tt > 0 ? 1450 - tt * h.v : 2200) + ') scale(' + h.s + ')'); });
  }
};
K.line = {   // ampaian: gambar disepit dan berayun, kamera bergerak ke kanan
  build(S) {
    const n = S.imgs.length, sp = 450, wd = 260 + n * sp;
    S.track = box(S.layer, wd, 1100, 'abs', '', 'top:0');
    const s = svg('svg', { width: wd, height: 1100, class: 'abs' }, S.track);
    svg('path', { d: 'M 0 360 Q ' + wd / 2 + ' 470 ' + wd + ' 360', fill: 'none', stroke: C.ink, 'stroke-width': 5 }, s);
    S.items = S.imgs.map((id, i) => {
      const x = 260 + i * sp, t = i / (n - 1 || 1), y = 360 + 110 * 4 * t * (1 - t) * .9;
      const p = photo(S.track, id, 400, 500, 18); p.el.style.transformOrigin = '50% 0';
      const peg = box(S.track, 26, 70, 'abs', '', 'background:' + [C.coral, C.butter, C.sky][i % 3] + ';border:4px solid #2D2D2D;border-radius:6px');
      return { p, peg, x, y, d: .2 + i * .25 };
    });
    S.title = box(S.layer, 1080, 200, 'abs', '<div class="big" style="font-size:96px">' + fmt(T.awal.label) + '</div>');
    S.wd = wd;
  },
  draw(S, lt) {
    const pan = lerp(0, -(S.wd - 1080 + 80), eIO((lt - .5) / (S.def.dur - 1)));
    S.track.style.transform = 'translate(' + pan + 'px,280px)';
    S.items.forEach((o, i) => {
      const k = eBack((lt - o.d) / .6), sw = Math.sin(lt * 2 + i * 1.3) * 5 * (1 - .5 * clamp(lt / 6));
      o.p.el.style.display = 'block'; o.p.el.style.opacity = clamp((lt - o.d) / .15);
      o.p.el.style.transform = 'translate(' + (o.x - 200) + 'px,' + (o.y + 10 - (1 - k) * 260) + 'px) rotate(' + sw + 'deg)';
      o.peg.style.transform = 'translate(' + (o.x - 13) + 'px,' + (o.y - 30) + 'px)';
    });
    const kt = eBack((lt - 1.2) / .6); S.title.style.transform = 'translate(0px,' + (1330 + (1 - kt) * 80) + 'px)'; S.title.style.opacity = clamp((lt - 1.2) / .2);
  }
};
K.stickers = {   // stiker ditampal: diangkat, kemudian ditekan ke kertas
  build(S) {
    const P = [[280, 520, -6], [800, 560, 5], [290, 1110, 4], [800, 1110, -5]];
    S.st = S.imgs.map((id, i) => { const n = NAT[id], s = Math.min(470 / n.h, 430 / n.w); const e = el('img', 'fit', S.layer); e.src = src(id); e.width = n.w; e.height = n.h; e.__w = n.w; e.__h = n.h; return { e, s, x: P[i][0], y: P[i][1], r: P[i][2], d: .4 + i * .9 }; });
  },
  draw(S, lt) {
    S.st.forEach(o => {
      const k = eOut((lt - o.d) / .55), sh = lerp(26, 6, k);
      o.e.style.transformOrigin = '50% 50%';
      setT(o.e, o.x, o.y - (1 - k) * 40, o.s * lerp(1.22, 1, k), o.r + (1 - k) * (o.r > 0 ? 12 : -12), clamp((lt - o.d) / .12));
      o.e.style.filter = 'drop-shadow(' + sh.toFixed(1) + 'px ' + sh.toFixed(1) + 'px 0 #2D2D2D)';
    });
  }
};
K.postcard = {   // poskad pantai bersetem + barisan polaroid kecil
  build(S) {
    S.pc = box(S.layer, 940, 640, 'card', '', 'background:#FFFDF6');

const SC = [];
function build() {

    const S = { def: d, i, a: t, b: t + d.dur, imgs: d.imgs };
    t = S.b; SC.push(S);

    const spots = [[70, 70], [1020, 110], [1040, 1400], [40, 1830], [990, 1870]], kinds = ['daisy', 'star', 'sun', 'cloud'];
    S.orn = spots.map((p, k) => ornament(os, kinds[(i + k) % 4], p[0], p[1], 56 + rnd(i * 5 + k) * 34));
    S.layer = el('div', 'abs', S.root, null, 'width:1080px;height:1920px');
    K[d.kind].build(S);
    const td = T[d.key] || {};
    if (td.label && d.kind !== 'line') { S.lbl = el('div', 'lblw', S.root, '<span class="pill">' + esc(td.label) + '</span>'); }
    if (td.caps && td.caps.length) {
      S.cap = el('div', 'card cap', S.root);
      S.caps = td.caps.map(([rt, txt], j) => { const ln = el('div', 'ln', S.cap, fmt(txt)); return { ln, words: [...ln.querySelectorAll('.w')], t0: S.a + rt, t1: j + 1 < td.caps.length ? S.a + td.caps[j + 1][0] : S.b }; });
    }
  });

  el('div', 'abs', document.body, null, 'width:1080px;height:1920px;background:#fff;opacity:0;z-index:999;pointer-events:none').id = 'fade';
}

function seek(t) {
  SC.forEach((S, i) => {
    const nx = SC[i + 1], vis = t >= S.a && (nx ? t < nx.a + .9 : t <= S.b + 1);
    S.root.style.display = vis ? 'block' : 'none'; if (!vis) return;
    const lt = t - S.a;
    S.root.style.clipPath = i === 0 ? 'none' : 'circle(' + (eOut(lt / .8) * 1500).toFixed(1) + 'px at 540px 960px)';
    S.orn.forEach((o, k) => o.g.setAttribute('transform', 'translate(' + o.x + ' ' + (o.y + Math.sin(t * 1.2 + k) * 6).toFixed(1) + ') scale(' + eBack((lt - .15 - k * .1) / .45).toFixed(3) + ')'));
    K[S.def.kind].draw(S, lt);
    if (S.lbl) { const kl = eBack((lt - .3) / .5); S.lbl.style.opacity = clamp((lt - .3) / .2); S.lbl.style.transform = 'translateY(' + ((1 - kl) * -60) + 'px)'; }
    if (S.cap) {
      let any = false;
      S.caps.forEach(c => {
        const on = t >= c.t0 && t < c.t1; c.ln.style.display = on ? 'block' : 'none'; if (!on) return; any = true;
        const out = clamp((c.t1 - t) / .3);
        c.words.forEach((w, k) => { const st = c.t0 + .08 * k, p = eBack((t - st) / .4); w.style.opacity = clamp((t - st) / .15) * out; w.style.transform = 'translateY(' + ((1 - p) * 28).toFixed(1) + 'px) scale(' + (.7 + .3 * p).toFixed(3) + ')'; });
      });
      const kc = eOut((lt - (S.caps[0].t0 - S.a) + .2) / .5);
      S.cap.style.display = any ? 'block' : 'none'; S.cap.style.opacity = kc; S.cap.style.transform = 'translateY(' + ((1 - kc) * 60) + 'px)';
    }
  });
}
